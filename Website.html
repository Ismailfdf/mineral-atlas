};
function inferFormationType(m){
  const t = (m.formation||"").toLowerCase();
  if(t.includes("karst")) return "karst-secondary";
  if(t.includes("weathering")||t.includes("oxidiz")||t.includes("secondary mineral")||t.includes("supergene")) return "weathering-secondary";
  if(t.includes("evaporat")) return "sedimentary-evaporite";
  if(t.includes("hydrothermal")) return "hydrothermal";
  if(t.includes("metamorph")) return "metamorphic";
  if(t.includes("igneous")||t.includes("magma")||t.includes("pegmatit")||t.includes("granit")||t.includes("volcanic")) return "igneous";
  return "general";
}
MINERALS.forEach(m=>{ m.formationType = inferFormationType(m); });

/* ===================== History & etymology =====================
   Standard, well-established etymological and historical facts (name
   origin, first description, historical use) — not speculative. Where a
   species' history isn't yet catalogued, the UI says so rather than
   inventing a story. */
const HISTORY = {
  quartz:{etymology:"From German Quarz, of uncertain deeper origin, possibly Slavic. The ancient Greeks called clear quartz krystallos, believing it was permanently frozen ice so cold it could never melt — the origin of the word \"crystal\", which only later came to mean any ordered solid rather than just this one mineral.",discovery:"Known and used since prehistory on every inhabited continent, long before anyone understood why it formed six-sided crystals. Its trigonal symmetry — genuinely distinct from true hexagonal symmetry despite looking similar at a glance — was only worked out once 19th-century crystallographers had the mathematical tools to classify symmetry systematically rather than by appearance alone.",use:"Ground for glassmaking and abrasives since antiquity, and valued enough as clear \"rock crystal\" that entire pieces were carved into lenses, seals and ornamental vessels well before glass could be made reliably transparent. Its piezoelectric property — generating a tiny voltage when squeezed — went undiscovered until the late 19th century and later became the basis of the quartz oscillators used in virtually every modern clock and watch."},
  calcite:{etymology:"From Latin calx, \"lime\", reflecting its long use in lime production — the same root that gives English words like \"calcium\" and \"calcify\".",discovery:"Clear, perfectly transparent \"Iceland spar\" calcite became central to 17th-century optics once observers noticed that objects viewed through it appeared doubled. That double image — birefringence — puzzled scientists for decades and became one of the key pieces of evidence used to work out the wave nature of light.",use:"Burned for lime and mortar since antiquity, one of the oldest continuously used building materials in human history. Optically clear calcite crystals were later cut into Nicol prisms, a 19th-century invention that made polarized-light microscopy possible and remains part of how geologists identify minerals in thin section today."},
  pyrite:{etymology:"From Greek pyrites lithos, \"stone that strikes fire\", for the sparks it throws when struck against steel — a property shared with flint, which is why the two were often used together.",discovery:"Known and used since antiquity as a fire-starting material, long before anyone understood its chemistry. The nickname \"fool's gold\" came much later, during 19th-century gold rushes, when its brassy color repeatedly fooled inexperienced prospectors who hadn't yet learned to check hardness and streak.",use:"Used historically as the spark-generating component in flintlock and wheellock firearms, and burned to produce sulfur dioxide for early sulfuric acid manufacture — at one point pyrite was a more important industrial sulfur source than native sulfur itself."},
  gold:{etymology:"English \"gold\" traces to a Proto-Germanic root meaning \"yellow\"; the chemical symbol Au comes from Latin aurum, which may itself derive from an older word for \"glow\" or \"dawn\".",discovery:"Among the very first metals worked by humans, used since at least the 6th millennium BCE — earlier than bronze or iron — precisely because native gold needs no smelting; it can be found and shaped as a metal straight out of the ground.",use:"Used for currency, jewelry and ornamentation across nearly every human civilization that has left a written or archaeological record, owing to a combination no other common metal offers: genuine rarity, extreme malleability, and almost total resistance to tarnish and corrosion."},
  cinnabar:{etymology:"From an ancient Mediterranean or Persian term (reaching English via Greek kinnabari) that originally referred broadly to a red substance, not specifically to this mineral.",discovery:"Used as the brilliant red pigment vermilion since antiquity in China, Rome and Mesoamerica — entirely independently in each region, since all three had access to local cinnabar deposits and discovered its pigment use on their own.",use:"Ground into vermilion pigment for painting and lacquerware for thousands of years, and historically roasted to yield elemental mercury — a process documented since Roman times and still referenced in alchemical texts for centuries afterward, long before its serious toxicity was properly understood and regulated."},
  stibnite:{etymology:"From Latin stibium, an old name for antimony ore, which is also the direct root of antimony's modern chemical symbol, Sb.",discovery:"Used as the cosmetic kohl in ancient Egypt and across the wider Middle East for millennia before anyone identified antimony as a distinct chemical element — the cosmetic use came first by thousands of years, the chemistry came much later.",use:"Historically ground into kohl for darkening eyelids and eyebrows, and burned for ritual and medicinal use in several ancient traditions; today it remains the principal ore mineral from which metallic antimony is extracted."},
  fluorite:{etymology:"From Latin fluere, \"to flow\" — it was added to ores as a flux to make them melt and flow more easily during smelting. That same root later gave rise to the word \"fluorescence\" once scientists studying this mineral noticed it could glow under ultraviolet light.",discovery:"Described as a metallurgical flux in 16th-century mining texts, notably by Georgius Agricola, well before fluorite was recognized as a chemically distinct mineral species rather than just a useful smelting additive.",use:"A long-standing metallurgical flux used to lower the melting point of ores, and later cut into lenses and prisms for specialty optics, since fluorite transmits a wider range of light wavelengths than ordinary glass."},
  realgar:{etymology:"From Arabic rahj al-ghar, roughly \"powder of the mine\" or \"dust of the cave\", reflecting where early miners actually encountered it.",discovery:"Used since antiquity as a red-orange pigment, almost always alongside its close chemical relative orpiment, in pigment-making traditions across the Mediterranean, the Middle East and East Asia, and later in early alchemical experimentation with arsenic compounds.",use:"Historically used as a pigment and, because it burns with a distinctive flame color, in early fireworks and signal fires; its use has been discontinued almost everywhere once its significant arsenic toxicity became well understood."},
  orpiment:{etymology:"From Latin auripigmentum, literally \"gold pigment\", for its brilliant, almost metallic-looking yellow color that could pass for powdered gold in paintings.",discovery:"Used as a yellow pigment across Europe and Asia since antiquity, and valued highly enough in some periods that it was traded over long distances specifically for its color, despite its toxicity being at least partially recognized even in ancient times.",use:"Historically ground for pigment, known in later European art trade as \"king's yellow\"; like realgar, its use has been almost entirely discontinued in favor of safer synthetic pigments."},
  barite:{etymology:"From Greek barys, \"heavy\" — the same root behind words like \"barometer\" — chosen because the mineral feels distinctly heavier in the hand than its pale, unremarkable appearance would suggest.",discovery:"Its unusual weight was noted and described by mineral collectors and early chemists well before barium itself was isolated as a new element by Humphry Davy in 1808, making barite one of several minerals whose physical oddity led directly to the discovery of a new chemical element.",use:"Valued historically for its weight as a filler and extender in pigments and paper, and today used at industrial scale as a weighting additive in drilling fluids for oil and gas wells, a use that depends on exactly the same high density first noticed centuries ago."},
  malachite:{etymology:"From Greek malache, \"mallow\" — a reference to the plant's green leaves — chosen for the mineral's characteristic banded green color rather than for any chemical property.",discovery:"Used as a pigment and carved ornamental stone in ancient Egypt for over 4,000 years, including as an eye cosmetic that may also have offered some protective benefit against eye infections, long before its copper-carbonate chemistry was understood.",use:"Historically ground for green pigment and eye paint, and still cut and polished today as an ornamental and lapidary stone prized for its distinctive concentric banding."},
  galena:{etymology:"From Latin galena, an ancient Roman name for lead ore or lead dross produced during smelting — the word predates any understanding of lead as a distinct chemical element.",discovery:"Smelted for lead since antiquity across the Mediterranean world and beyond, and frequently found to carry economically significant amounts of silver, which made many ancient lead mines valuable chiefly as silver sources rather than for the lead itself.",use:"The principal lead ore since antiquity; in the early 20th century, natural galena crystals were also used as simple semiconductor detectors in \"cat's whisker\" crystal radio receivers, decades before anyone had a formal theory of semiconductors to explain why it worked."},
  tyuyamunite:{etymology:"Named directly after its type locality, the Tyuya-Muyun deposit, rather than after any chemical or physical property — a naming style common for minerals that turn out to be geographically very restricted.",discovery:"First described in 1912 in the Bulletin of the Imperial St. Petersburg Academy of Sciences. Its discovery sits inside a short but important window: Tyuya-Muyun had been worked for copper since antiquity, but from 1899 it was re-investigated specifically as a radium source, at a time when the Russian Empire had almost no domestic radium supply of its own and radioactivity research was still new. Describing tyuyamunite was part of characterizing exactly what the deposit's unusual yellow coating actually was.",use:"No modern industrial use. Historically, its significance was entirely as a uranium/radium-bearing mineral during a brief period when Central Asian ore was one of the only domestic sources available to Russian researchers, before much richer uranium deposits were developed elsewhere in the 20th century."},
  turanite:{etymology:"Named after \"Turan\", a historical name for the wider Central Asian lowlands — not after a person, which was a deliberate choice to tie the mineral to its region rather than to an individual.",discovery:"First described in 1909 by the Russian chemist Konstantin Nenadkevich, who was closely involved in investigating Central Asian ore deposits during the same early radium-exploration period that brought attention to Tyuya-Muyun generally. Almost a century later, in 2004, Elena Sokolova and coauthors re-examined the species with modern X-ray methods and published a corrected atomic structure — a useful reminder that even a named, accepted mineral species can have its fundamental structure revised once better instruments become available.",use:"No industrial use. It remains of interest mainly as part of the unusually complete, single-locality vanadate suite that makes Tyuya-Muyun scientifically distinctive."},
  khaidarkanite:{etymology:"Named directly after its type locality, the Khaidarkan deposit, following the same locality-naming convention as tyuyamunite.",discovery:"Described as a new species from the oxidized zone of a deposit that had already been mined at large scale for most of the 20th century — a reminder that even long-worked, well-studied mines can still yield previously uncharacterized minerals once a small, unusual specimen gets proper modern analytical attention.",use:"No industrial use; of scientific and collector interest, and a useful example of how secondary minerals keep forming and being discovered in mine oxidation zones long after primary mining has ended."},
  vanadinite:{etymology:"Named simply for its vanadium content, following a common and straightforward naming pattern for minerals defined by one chemically distinctive element.",discovery:"First described in the early 19th century, during the same general period when vanadium itself was being isolated and characterized as a new element — chemists studying unusual lead ores from Mexico and Spain kept finding a metal that didn't match any known element, and vanadinite was one of the minerals that helped pin down what it was.",use:"Historically a very minor source of vanadium where locally concentrated enough to be worth extracting; today it is valued almost entirely as a collector mineral, prized for crystals with an unusually saturated red-orange color rarely matched by other common minerals."},
  descloizite:{etymology:"Named after the French mineralogist Alfred Des Cloizeaux, a 19th-century figure particularly known for advancing the optical study of minerals under the microscope.",discovery:"Described in the mid-19th century, part of a wave of newly recognized secondary lead-zinc-vanadium minerals that followed as better chemical analysis made it possible to tell apart species that earlier mineralogists had lumped together simply because they looked similar.",use:"No significant industrial use; it remains mainly of interest to mineral collectors and as a marker of oxidized-zone chemistry in lead-zinc-vanadium deposits."},
  wakabayashilite:{etymology:"Named after Yaichiro Wakabayashi, a Japanese mineral collector and mine manager who was credited for his role in helping characterize the species.",discovery:"First characterized from Japanese arsenic-antimony deposits, then later recognized at other low-temperature As-Sb-Hg hydrothermal localities worldwide, including Khaidarkan — a pattern typical of rare sulfosalts, which are often initially described from one well-studied locality and only later confirmed to occur elsewhere once collectors and researchers know what to look for.",use:"No industrial use; of scientific and collector interest, mainly as a marker of the same low-temperature As-Sb hydrothermal chemistry responsible for realgar and orpiment."},
  hematite:{etymology:"From Greek haima, \"blood\", for the blood-red streak it leaves even when a specimen itself looks metallic silver-gray on the surface — a vivid illustration of why streak, not surface color, is the more reliable identification test.",discovery:"One of the very oldest pigment minerals used by humans: red ochre pigments containing hematite appear in cave art and burial sites tens of thousands of years old, making it a strong candidate for the first mineral humans deliberately processed for color rather than for tools.",use:"Used as a red pigment continuously since prehistory, through classical antiquity and into modern paint manufacture, and today the single most important iron ore mineral worldwide, feeding the majority of global steel production."},
  magnetite:{etymology:"Traditionally traced to Magnesia, an ancient region in Greece reportedly associated with early finds of naturally magnetic stone, though the exact origin story is debated among historians of science.",discovery:"Its natural magnetism — rare among common minerals — was independently noticed in both the Mediterranean world and in China, and became central to the invention of the magnetic compass over a thousand years ago, one of the most consequential technological applications of any single mineral property in human history.",use:"Used historically as \"lodestone\" in early compasses and as a simple way to magnetize iron needles; today it is a major iron ore and is also used in heavy-media separation processes that exploit its magnetism to sort other minerals out of crushed ore."},
  azurite:{etymology:"From Persian/Arabic lazhward (\"blue\"), the same root that gives English the word \"azure\" — the term traveled into European languages alongside the blue pigment lapis lazuli, a completely different mineral that shares only the color and the etymology.",discovery:"Used as a blue pigment since antiquity, and especially prominent in medieval and Renaissance European painting, where it was one of the only reasonably accessible blue pigments available before synthetic ultramarine and Prussian blue were developed — many old-master paintings owe their blues specifically to ground azurite.",use:"Historically ground and used as a blue pigment in painting and manuscript illumination; today it is mainly collected and cut for jewelry, usually intergrown with its green relative malachite."},
  gypsum:{etymology:"From Greek gypsos, referring to plaster — a word that entered Greek itself from an even older Semitic root for a type of chalky soil or lime.",discovery:"Used for plaster and building material since ancient Egypt, where gypsum plaster is documented in construction contexts going back thousands of years, making it one of humanity's oldest manufactured building materials rather than a modern industrial invention.",use:"The basis of plaster of Paris — named for the extensive gypsum deposits historically quarried near Paris — and, in finely ground form, the core raw material of modern drywall and wallboard."},
  orthoclase:{etymology:"From Greek orthos (\"straight\") and klasis (\"fracture\"), describing how its two cleavage planes meet at a clean right angle — a naming convention mineralogists used for several feldspar species to describe cleavage geometry rather than color or origin.",discovery:"Formally distinguished from other feldspars during 19th-century efforts to classify the feldspar group systematically, once chemists could reliably tell potassium-rich from sodium- and calcium-rich feldspar varieties that often look nearly identical in hand specimen.",use:"Used in ceramics and glassmaking as a flux that lowers the melting temperature of the raw batch, a role it has held in industrial glass and porcelain production since those industries scaled up in the 18th and 19th centuries."},
  muscovite:{etymology:"Named for \"Muscovy glass\", the old European trade name for large, thin sheets of this mica imported from Russia (historically called Muscovy) and sold as a cheaper substitute for window glass.",discovery:"Its practical use as a window material in cold climates predates its formal mineralogical classification by a considerable margin — people were glazing windows with mica sheets long before mineralogists had worked out exactly what distinguished one mica species from another.",use:"Historically used as a glass substitute for windows and lanterns; today it serves mainly as an electrical insulator (owing to its excellent dielectric properties) and as a filler and shimmer additive in paints, joint compound and cosmetics."},
  chalcopyrite:{etymology:"From Greek chalkos (\"copper\") and pyrites (\"fire stone\"), directly grouping it with pyrite as a visually similar \"fire stone\" that happens to carry copper instead of iron.",discovery:"The dominant copper ore mineral since the Bronze Age, when it was smelted (often without clearly distinguishing it from pyrite) to produce the copper that, alloyed with tin, gave the Bronze Age its name and its defining technology.",use:"The world's most economically important copper ore mineral today, supplying the majority of copper mined globally for electrical wiring, plumbing and countless industrial alloys."},
  sphalerite:{etymology:"From Greek sphaleros, \"treacherous\" or \"deceiving\" — a pointed name chosen because miners repeatedly mistook it for valuable lead ore and were disappointed to find it yielded no lead at all.",discovery:"Long confused with galena and other dark, heavy minerals before zinc was properly recognized as a distinct, economically valuable metal in its own right — for centuries, sphalerite-rich ore was often discarded as worthless waste rock precisely because of this confusion.",use:"The world's most important zinc ore mineral today, and also a significant byproduct source of cadmium, gallium, germanium and indium, several of which are critical to modern electronics."},
  arsenopyrite:{etymology:"A straightforward descriptive name combining its arsenic content with a pyrite-like metallic appearance — one of several sulfide minerals named this way once chemists could distinguish arsenic-bearing sulfides from ordinary iron sulfides.",discovery:"Historically an important arsenic ore mineral, and long used by prospecting miners as a visual \"pathfinder\": its frequent association with gold mineralization meant that finding arsenopyrite in a rock was often treated as a promising sign worth following up, long before anyone could explain the geochemical reason why.",use:"Historically the main ore mineral of arsenic; today it is valued mainly by exploration geologists as a pathfinder mineral that can help locate gold deposits rather than for the arsenic itself."},
  tourmaline:{etymology:"From the Sinhalese word turamali, a general term used in Sri Lanka for mixed, often colorful gem gravels, which Dutch traders adopted wholesale in the 18th century when they began bringing the stones back to Europe without fully distinguishing which gem species they were actually buying.",discovery:"Long confused with other colored gemstones (different tourmaline colors were sometimes mistaken for ruby, emerald or sapphire) before mineralogists recognized it as a single, chemically complex group in its own right — one made unmistakable once its unusual pyroelectric property was studied, since heating a tourmaline crystal causes one end to develop an electric charge.",use:"Widely cut as a gemstone across its many colors, from the black schorl variety (mainly of interest to petrologists studying rock chemistry) to the vivid pink, green and blue varieties prized in fine jewelry."},
  actinolite:{etymology:"From Greek aktis (\"ray\") and lithos (\"stone\"), chosen to describe its often radiating, needle-like crystal clusters rather than any chemical property.",discovery:"Classified within the broader amphibole group as 19th-century mineralogists worked out the continuous chemical series connecting actinolite to its magnesium-rich relative tremolite — an early example of mineralogists needing to accept that two named minerals could really be end-members of one sliding chemical scale rather than two sharply separate species.",use:"No major industrial use as a discrete mineral; certain fibrous habits of actinolite fall under regulatory definitions of asbestos, requiring standard occupational handling precautions."},
  albite:{etymology:"From Latin albus, \"white\", for the pale, often near-colorless appearance typical of this feldspar compared with some of its more strongly colored relatives.",discovery:"Recognized as the sodium-rich end-member of the plagioclase feldspar series once 19th-century chemists worked out that plagioclase wasn't one fixed mineral but a continuous solid-solution series running from pure albite to pure calcium-rich anorthite, with every composition in between occurring in nature.",use:"Used industrially in ceramics and glass manufacture as a flux, in essentially the same role as its potassium-feldspar relatives orthoclase and microcline."},
  biotite:{etymology:"Named after the French physicist Jean-Baptiste Biot, who studied how light behaves when passed through different mica specimens and helped establish mica's optical properties as a useful diagnostic tool.",discovery:"Distinguished as its own mineral once 19th-century chemical analysis showed it had a consistently iron- and magnesium-rich composition clearly different from the more aluminum-rich, iron-poor muscovite — before that distinction was clear, \"mica\" was treated more as one general substance than as several related species.",use:"Of limited direct industrial use, but valuable to geologists for two different reasons: its chemistry records the conditions under which a rock crystallized, and its potassium content makes it directly useful for radiometric (potassium-argon and argon-argon) age dating."},
  chlorite:{etymology:"From Greek chloros, \"green\" — the same root behind \"chlorophyll\" (green plant pigment) and \"chlorine\" (named for its own greenish-yellow gas color), reflecting how often this color word got reused across very different branches of 18th- and 19th-century chemistry and mineralogy.",discovery:"Long recognized simply as \"the common green metamorphic mineral\" well before mineralogists untangled the chlorite group's considerable internal chemical complexity, which actually spans several distinct mineral species sharing a similar sheet-silicate structure and similar green color.",use:"No major industrial use as a discrete species; it serves mainly as a geological indicator, since its presence is a reliable sign that a rock has undergone the specific, relatively low-temperature style of alteration called propylitic alteration."},
  epidote:{etymology:"From Greek epidosis, \"increase\" or \"addition\" — a name the mineralogist who first described it chose because he noticed that one face of its crystals was consistently longer than the corresponding opposite face, an asymmetry he wanted the name itself to flag.",discovery:"Named in 1801 by the French mineralogist René Just Haüy, one of the founding figures of modern crystallography, during the same broad period when he was developing his influential theory that a crystal's external shape reflects the orderly, repeating arrangement of its internal building blocks.",use:"No major industrial use; occasionally cut as a minor gemstone, but mainly valued by geologists as a reliable marker of metamorphic or hydrothermal alteration conditions."},
  kaolinite:{etymology:"Named after Kao-Ling (Gaoling), literally \"high hill\", a specific hill in Jingdezhen, China, that had been mined for fine white clay used in porcelain manufacture for centuries before the mineral reached Western scientific attention.",discovery:"Used as the essential raw material of Chinese porcelain for many centuries — porcelain made there was prized and exported internationally long before European chemists worked out what specific clay mineral gave it its characteristic fine, white, workable texture.",use:"Remains the essential raw material of porcelain manufacture today, and is also a major ingredient in coated paper, where it gives glossy paper stock its smooth, bright printing surface."},
  microcline:{etymology:"From Greek mikros (\"small\") and klinein (\"to incline\"), describing the very slight — just over half a degree — deviation of its cleavage angle from the clean right angle seen in its close relative orthoclase.",discovery:"Recognized as a chemically identical but structurally distinct, triclinic low-temperature polymorph of potassium feldspar only once X-ray diffraction became available in the 20th century, since the two minerals are essentially impossible to tell apart by eye or by ordinary chemical testing.",use:"Used industrially in ceramics and glass manufacture, exactly like orthoclase, since the two are so chemically similar that most industrial users don't need to distinguish between them at all."},
  celestine:{etymology:"From Latin caelestis, \"celestial\" or \"sky-colored\", chosen for the delicate pale blue tint seen in some (though by no means all) specimens — plenty of celestine is colorless or white instead.",discovery:"Recognized as a chemically distinct strontium mineral during the same late-18th-century period when strontium itself was first being isolated and characterized as a new element, making celestine one of the minerals that helped establish strontium's place in the growing periodic table of known elements.",use:"The principal ore of strontium, historically important because strontium compounds burn with a distinctive, intense red flame — the basis of red coloring in fireworks and emergency flares."},
  diamond:{etymology:"From Greek adamas, \"unbreakable\" or \"untamed\" — the same root that gives English the word \"adamant\" — chosen simply because nothing else known could scratch it.",discovery:"Mined and valued in India for over two thousand years, the world's only known source for most of that history, before Brazilian deposits were found in the 18th century and South African deposits in the 19th century reshaped the global supply. Its identity as nothing more than pure carbon was established only in the late 18th century, when Antoine Lavoisier burned a diamond under controlled conditions and showed it produced carbon dioxide and nothing else — a genuinely startling result at the time, since nobody expected the hardest known substance to be made of the same element as soot.",use:"Used as a gemstone since antiquity, and since the industrial era also the premier abrasive and cutting material for tools that need to shape or grind other hard materials, a role made possible by exactly the same hardness that first made it so prized as a gem."},
  graphite:{etymology:"From Greek graphein, \"to write\" — a name chosen by the German mineralogist Abraham Gottlob Werner in 1789 specifically to describe its most familiar practical use.",discovery:"Long confused with other soft, dark, metallic-looking minerals, including molybdenite and even galena, before Werner and his contemporaries worked out that it was chemically distinct from all of them. Its true identity as a polymorph of pure carbon — the same element as diamond, arranged completely differently — wasn't firmly established until chemical analysis matured enough to settle the question.",use:"Used for writing and drawing since at least the 16th century, when a large graphite deposit was found in England and encased in wood to make the first true pencils; today it is also used in lubricants, high-temperature refractories, and as the electrode material in most lithium-ion batteries."},
  corundum:{etymology:"From Sanskrit kuruvinda, an old name applied specifically to ruby long before corundum was understood as a broader mineral species that also includes sapphire and plain gray industrial material.",discovery:"Ruby and sapphire were prized, actively traded gemstones across South Asia for millennia before anyone realized they were chemically the same mineral (aluminum oxide) colored by different trace impurities — chromium for ruby's red, iron and titanium for sapphire's blue — a connection only confirmed once chemical analysis became precise enough to compare them directly.",use:"Cut as a gemstone for millennia in its ruby and sapphire varieties, and since the 19th century also manufactured synthetically at industrial scale and used as an abrasive, owing to a hardness exceeded naturally only by diamond."},
  topaz:{etymology:"Possibly from Topazios, an ancient Greek name for an island in the Red Sea — though the mineral actually mined on that island in antiquity may well have been a different, unrelated green species (now generally thought to be peridot), making \"topaz\" an early and striking example of a gemstone name becoming detached from the material it originally described.",discovery:"Used loosely for centuries as a name for almost any yellow gemstone, including yellow quartz (citrine), before true topaz was chemically and structurally distinguished from quartz — the two look similar enough in color that the confusion persisted in trade well into the modern era.",use:"Cut as a gemstone, with heat treatment and irradiation now commonly used in the gem trade to intensify or alter its natural color, practices that have become standard enough that untreated topaz is often marketed specifically as such."},
  garnet:{etymology:"From Latin granatum, \"pomegranate\" — the small, rounded, deep red crystals of the most familiar garnet variety closely resemble the seeds clustered inside a pomegranate fruit.",discovery:"Used as a gemstone since the Bronze Age, appearing in jewelry from ancient Egypt, Greece and Rome alike, long before mineralogists worked out that \"garnet\" wasn't a single mineral at all but an entire group of chemically related species forming a complex solid-solution series, including the iron-rich almandine variety most commonly encountered.",use:"Cut as a gemstone in its many color varieties, and also a significant industrial abrasive — garnet sandpaper and the garnet used in waterjet cutting both rely on the same hardness and lack of cleavage that make it durable as a gem."},
  halite:{etymology:"From Greek hals, \"salt\" — among the simplest and oldest mineral names in use, reflecting how directly familiar this mineral has always been to ordinary people rather than only to specialists.",discovery:"Arguably the single mineral most important to human history: ancient salt trade routes shaped entire regional economies and political structures, salt taxes funded governments for centuries, and the word \"salary\" itself derives from the Latin salarium, payments historically associated with salt allowances for Roman soldiers.",use:"Used as table and industrial salt, for food preservation long before refrigeration existed, for de-icing roads, and as a basic feedstock for the chlor-alkali chemical industry that produces much of the world's industrial chlorine and sodium hydroxide."},
  dolomite:{etymology:"Named after the French geologist Déodat de Dolomieu — and, in an unusual reversal, the Dolomite mountains of northern Italy were subsequently named after this rock and mineral, rather than the mineral being named after the mountains.",discovery:"Described in 1791 after Dolomieu, traveling through the Alps, noticed that certain limestone-like rocks did not fizz vigorously with dilute acid the way ordinary limestone does — a small, easily overlooked field observation that turned out to mark a genuinely distinct mineral and rock type.",use:"Used as a construction aggregate and, because it contains substantial magnesium alongside calcium, as an industrial source of magnesium compounds."},
  silver:{etymology:"English \"silver\" traces back to Old English seolfor; the chemical symbol Ag instead comes from Latin argentum, reflecting how often early chemistry retained Latin or Greek roots for element symbols even when the common English name had a completely different, unrelated origin.",discovery:"Worked by humans since at least the 4th millennium BCE, and used as currency and a store of value across many ancient civilizations alongside gold — in several ancient economies silver was, for long periods, treated as the more practical everyday currency metal precisely because it was less rare than gold.",use:"Used for jewelry, currency, and modern electronics, where its exceptionally high electrical and thermal conductivity (the highest of any metal) make it valuable in specialized contacts and circuits; historically it was also essential to photography, since light-sensitive silver halide compounds were the basis of photographic film for well over a century."},
  copper:{etymology:"From Latin cuprum, itself derived from Cyprus — the island was such a major Roman-era source of the metal that \"metal of Cyprus\" effectively became the metal's name across much of the Latin-speaking world.",discovery:"One of the very first metals worked by humans, important enough to give its name to the Chalcolithic, or \"Copper Age\", the transitional period of prehistory between the Stone Age and the Bronze Age when copper tools began replacing stone ones before bronze alloying was discovered.",use:"Used for electrical wiring and plumbing today on an enormous industrial scale, and for alloys — bronze (copper and tin) and brass (copper and zinc) — that have been essential materials since antiquity and remain widely used now."},
  apatite:{etymology:"From Greek apate, \"deceit\" — a pointed choice of name, since early mineralogists kept mistaking apatite for other, more valuable gem minerals it happened to resemble in color and appearance.",discovery:"Named in 1786 by the German geologist Abraham Gottlob Werner specifically to call out this long history of misidentification — essentially naming the mineral after the mistake people kept making about it, rather than after any property of the mineral itself.",use:"The primary phosphate mineral mined for agricultural fertilizer worldwide, and, in a very different context, the essential mineral component of tooth enamel and bone in the human body, where a closely related form called hydroxylapatite provides their hardness and structure."},
  olivine:{etymology:"Named for its characteristic olive-green color — one of the more literal mineral names in the whole classification.",discovery:"Recognized as a distinct mineral group in the late 18th century, well before geologists understood that olivine makes up most of the Earth's upper mantle; that realization came gradually from studying olivine-rich rock fragments carried up by volcanoes.",use:"Gem-quality olivine, called peridot, has been cut as a gemstone since antiquity; granular olivine is also used as a refractory and foundry sand."},
  augite:{etymology:"From Greek augē, \"brightness\" or \"luster\", referring to the shiny cleavage faces of its crystals.",discovery:"Named in the late 18th century during the early systematic classification of rock-forming minerals, and later recognized as the most common member of the pyroxene group.",use:"No major industrial use; its main importance is as a key mineral for identifying and classifying basalt and gabbro."},
  hornblende:{etymology:"From German Horn (\"horn\") and blenden (\"to deceive\"), a miners' name: the dark, shiny crystals looked promisingly like metal ore but yielded no metal when smelted.",discovery:"Long known to miners as a nuisance mineral before mineralogists recognized it as the most common member of the amphibole group and a major constituent of many igneous and metamorphic rocks.",use:"No major industrial use; valued by geologists as an indicator of crystallization and metamorphic conditions."},
  zircon:{etymology:"Probably from Persian zargun, \"gold-colored\", though the exact origin of the name is not certain.",discovery:"Used as a gemstone for centuries; in 1789 the chemist Martin Klaproth identified a new element, zirconium, within it. In the 20th century zircon became central to geology when its uranium content made uranium-lead dating possible, and zircon grains turned out to be the oldest surviving pieces of Earth's crust.",use:"Cut as a gemstone, used as a refractory and ceramic opacifier, and above all used by geochronologists as a natural clock for dating rocks."},
  kyanite:{etymology:"From Greek kyanos, \"dark blue\", for its typical color.",discovery:"Named in the late 18th century; its strongly different hardness along and across a crystal made it one of the earliest minerals noticed to have directionally dependent properties.",use:"Used in heat-resistant ceramics and refractories, and occasionally cut as a gemstone."},
  staurolite:{etymology:"From Greek stauros (\"cross\") and lithos (\"stone\"), for its famous cross-shaped twinned crystals.",discovery:"Recognized in the late 18th century; the cross-shaped twins appear in folklore, and in parts of the Appalachian Mountains they are traditionally called \"fairy stones\".",use:"Twinned crystals have long been collected and worn as natural charms or curios; geologists use staurolite as an index mineral for medium-grade metamorphism."},
  beryl:{etymology:"From Greek beryllos, ultimately traced to an Indian (Prakrit/Sanskrit) word for a gem; the same root later gave the element beryllium its name.",discovery:"Emeralds were mined in ancient Egypt, and beryl varieties have been prized for millennia. In 1798 the chemist Louis-Nicolas Vauquelin found a new element within beryl, which was later isolated as metallic beryllium in the 1820s.",use:"Cut as emerald, aquamarine, morganite and other gem varieties; also the main industrial source of beryllium for aerospace and specialized alloys."},
  spodumene:{etymology:"From Greek spodumenos, \"burnt to ashes\", because the mineral turns ash-gray and crumbles into a powder when strongly heated.",discovery:"Described in the early 19th century. Lithium was first identified in 1817 in a related mineral, petalite, and soon afterward in spodumene, which later became its most important ore.",use:"Today the leading hard-rock source of lithium for rechargeable batteries; pink kunzite and green hiddenite varieties are cut as gems."},
  talc:{etymology:"From Arabic and Persian talq, a name for the mineral that reached European languages through medieval trade and science.",discovery:"Massive talc (soapstone) has been carved into vessels, seals and ornaments since antiquity because it is so soft; talc's place at the very bottom of the Mohs hardness scale was fixed when Friedrich Mohs devised the scale in 1812.",use:"Used for carving, and ground into powder for cosmetics, ceramics, paper and paint filler."},
  rutile:{etymology:"From Latin rutilus, \"red\" or \"glowing\", for its deep red-brown color.",discovery:"Named in the early 19th century; in 1795 the chemist Martin Klaproth recognized that it contained the element titanium, which he had named from the Titans of Greek mythology.",use:"The main source of titanium dioxide pigment and an important ore of titanium metal."},
  spinel:{etymology:"The origin of the name is uncertain; it is often linked to a Latin word for \"thorn\", referring to the pointed octahedral crystals.",discovery:"For centuries red spinel was called \"balas ruby\" and treated as a kind of ruby; only improved mineral analysis in the 18th and 19th centuries showed that spinel and ruby are chemically distinct minerals.",use:"Cut as a gemstone; several famous gems in royal collections that were long called rubies turned out to be spinels."},
  chromite:{etymology:"Named for its chromium content.",discovery:"Chromium itself was discovered in 1797 by Louis-Nicolas Vauquelin in a different mineral, crocoite; chromite was recognized soon afterward as a far more abundant source of the element.",use:"The only commercial ore of chromium, used for stainless steel, chrome plating and heat-resistant alloys."},
  cassiterite:{etymology:"From Greek kassiteros, \"tin\"; the Greeks also spoke of the Cassiterides, the legendary \"Tin Islands\" from which tin was traded.",discovery:"Tin from cassiterite, alloyed with copper, defined the Bronze Age; ancient trade routes carried tin over very long distances because deposits were rare.",use:"Still the principal ore of tin, used in solder, coatings and alloys."},
  molybdenite:{etymology:"From Greek molybdos, \"lead\", because for a long time it was confused with lead ores and with graphite.",discovery:"In 1778 the Swedish chemist Carl Wilhelm Scheele showed that molybdenite was a distinct substance and not graphite or a lead mineral; in 1781 Peter Jacob Hjelm isolated the new metal, molybdenum, from it.",use:"The main ore of molybdenum, used to harden steel; molybdenum disulfide is also a well-known dry lubricant."},
  bornite:{etymology:"Named in the 19th century for Ignaz von Born, an Austrian mineralogist and metallurgist.",discovery:"Long mined as a copper ore under various older names before being formally named; its rapid tarnishing from bronze to iridescent purple earned it the collectors' nickname \"peacock ore\".",use:"An important copper ore, especially in enriched zones of large copper deposits."},
  rhodochrosite:{etymology:"From Greek rhodon (\"rose\") and chroma (\"color\"), for its pink to rose-red color.",discovery:"Named in the early 19th century; banded rhodochrosite from Argentina, known locally as \"Inca Rose\", is the country's national stone.",use:"Carved and polished as an ornamental stone and a minor source of manganese."},
  siderite:{etymology:"From Greek sideros, \"iron\".",discovery:"One of the iron ores that fed early iron-making in Europe, particularly where it occurs as nodules and beds in coal-bearing rocks.",use:"Historically an important iron ore; today largely replaced by richer hematite and magnetite deposits."},
  scheelite:{etymology:"Named for the Swedish chemist Carl Wilhelm Scheele.",discovery:"In 1781 Scheele showed that this heavy white mineral contained a previously unknown acid; two years later the Spanish d'Elhuyar brothers isolated the metal tungsten from the related mineral wolframite.",use:"A principal ore of tungsten, used for hard-metal tools; its blue-white glow under ultraviolet light makes it easy to spot with a UV lamp."},
  andalusite:{etymology:"Named after Andalusia in Spain, where it was first reported — although later work suggested the original locality had been misattributed.",discovery:"Recognized in the late 18th century; its variety chiastolite, with a dark cross inside each crystal, has been collected as a curiosity for a very long time.",use:"Used in refractories; geologists use it, together with kyanite and sillimanite, to read the pressure and temperature history of metamorphic rocks."},
  sillimanite:{etymology:"Named for Benjamin Silliman, the American chemist and mineral collector who taught at Yale.",discovery:"Named in the 1820s; its fibrous form, called fibrolite, was long mistaken for other minerals until chemical analysis showed it had the same formula as kyanite and andalusite.",use:"Used in refractories; valued by geologists as an indicator of high-temperature metamorphism."},
  wollastonite:{etymology:"Named after William Hyde Wollaston, the English chemist and mineralogist.",discovery:"Named in the early 19th century; it became a textbook example of a mineral formed when hot intrusions bake limestone and release carbon dioxide.",use:"Used in ceramics, paints, plastics and as an asbestos substitute in some products."},
  zoisite:{etymology:"Named for Baron Sigmund Zois von Edelstein, a Slovenian scientist and mineral collector who supplied specimens to Europe's mineralogists.",discovery:"Named in the early 19th century. The blue gem variety tanzanite was found in Tanzania in the 1960s and quickly became a major gemstone through jewelry-trade promotion.",use:"Tanzanite is a significant colored gemstone; ordinary zoisite is mainly of geological interest."},
  serpentine:{etymology:"From Latin serpens, \"snake\", because the mottled green surface of many specimens resembles snakeskin.",discovery:"Serpentine rock has been carved since antiquity; its fibrous variety, chrysotile, became the most widely used form of asbestos in the 19th and 20th centuries.",use:"Used as an ornamental carving stone; asbestos use has been banned or restricted in many countries because of health risks."},
  pyrophyllite:{etymology:"From Greek pyr (\"fire\") and phyllon (\"leaf\"), because it swells and splits into leaf-like layers when heated.",discovery:"Named in the early 19th century and long confused with talc, which it closely resembles in look and feel.",use:"Used in ceramics and refractories, and as a carving stone in East Asia."},
  chrysocolla:{etymology:"From Greek chrysos (\"gold\") and kolla (\"glue\"), because ancient metalworkers used a copper mineral of this kind as a flux to solder gold.",discovery:"The name appears in ancient Greek writings, though it was then applied to several different blue-green copper minerals.",use:"Cut as an ornamental stone and a minor copper ore."},
  wulfenite:{etymology:"Named for Franz Xaver von Wulfen, an Austrian Jesuit and mineralogist who studied the mineral in Carinthia in the 18th century.",discovery:"Wulfen described the orange-yellow lead mineral from Carinthia in the 1700s; the species was formally named in 1845.",use:"Mainly a collector's mineral, prized for its thin, bright tabular crystals."},
  anhydrite:{etymology:"From Greek an- (\"without\") and hydor (\"water\"), because it is chemically the same as gypsum but lacks water in its structure.",discovery:"Named in 1804 by Abraham Gottlob Werner, who distinguished it from gypsum on the basis of its different hardness and cleavage.",use:"Used as a cement additive and soil conditioner."},
  pyromorphite:{etymology:"From Greek pyr (\"fire\") and morphe (\"form\"), because a molten bead of the mineral, on cooling, crystallizes into a regular shape.",discovery:"Named in the early 19th century on the basis of this blowpipe test, one of the classic bench tests of early mineral identification.",use:"A minor ore of lead; mostly a collector's mineral."},
  monazite:{etymology:"From Greek monazein, \"to be solitary\", referring to its rare, isolated crystals in the rocks where it was first found.",discovery:"Monazite sands in Brazil and India became an important source of thorium in the late 19th century, used in gas lantern mantles, and later of the rare-earth elements.",use:"A principal ore of cerium, lanthanum and neodymium, used in magnets, catalysts and electronics."},
  uraninite:{etymology:"Named for its uranium content; the massive pitch-like variety is called pitchblende.",discovery:"In 1789 Martin Klaproth identified uranium in pitchblende. In 1898 Marie and Pierre Curie extracted the new radioactive elements polonium and radium from pitchblende residues.",use:"The principal ore of uranium, used as nuclear fuel; historically also mined for radium."},
  cuprite:{etymology:"From Latin cuprum, \"copper\".",discovery:"A copper ore known since antiquity; its deep red crystals earned it the old name \"ruby copper\".",use:"A minor ore of copper, and a collector's mineral."},
  goethite:{etymology:"Named for Johann Wolfgang von Goethe, the German poet, who was also an enthusiastic mineral collector.",discovery:"Named in 1806 in Goethe's honor; goethite is the main component of many rusty-brown ochres and weathering crusts.",use:"A minor iron ore and a natural brown-yellow pigment."},
  pyrolusite:{etymology:"From Greek pyr (\"fire\") and louein (\"to wash\"), because glassmakers used it to remove the green tint caused by iron impurities in glass.",discovery:"Used for centuries as a glass decolorizer and a black pigment before chemists recognized manganese as a distinct element in the 1770s.",use:"The main ore of manganese, used in steelmaking and in batteries."},
  covellite:{etymology:"Named for Niccolò Covelli, the Italian mineralogist who first described it from Mount Vesuvius.",discovery:"Described in the 1820s from volcanic deposits at Vesuvius, where it formed in fumaroles.",use:"A minor copper ore; prized by collectors for its deep indigo-blue color."},

/* ===================== Chemical reactions =====================
   Only well-established, correctly-balanced equations are included; where
   no clean characteristic reaction exists (or balancing it would require
   oversimplifying a genuinely multi-step natural process), the mineral is
   left out rather than given an approximate or invented equation. */
const REACTIONS = {
  calcite:[{label:"Reaction with dilute hydrochloric acid (standard field test)",equation:"CaCO₃ + 2HCl → CaCl₂ + H₂O + CO₂↑",note:"Vigorous, immediate fizzing — the classic carbonate field test."}],
  dolomite:[{label:"Reaction with dilute hydrochloric acid",equation:"CaMg(CO₃)₂ + 4HCl → CaCl₂ + MgCl₂ + 2H₂O + 2CO₂↑",note:"Much slower than calcite on a solid surface — powdering the sample speeds the reaction, a standard way to tell the two apart in the field."}],
  pyrite:[{label:"Oxidative weathering (acid mine drainage reaction)",equation:"4FeS₂ + 15O₂ + 14H₂O → 4Fe(OH)₃ + 8H₂SO₄",note:"This natural oxidation reaction is the underlying cause of acid mine drainage wherever pyrite-bearing rock is exposed to air and water."}],
  magnetite:[{label:"Oxidation to hematite (weathering/alteration)",equation:"4Fe₃O₄ + O₂ → 6Fe₂O₃",note:"A common near-surface alteration reaction converting magnetite to hematite."}],
  malachite:[{label:"Precipitation from copper-bearing solution",equation:"2Cu²⁺ + CO₃²⁻ + 2OH⁻ → Cu₂CO₃(OH)₂",note:"The secondary precipitation reaction that forms malachite in the oxidized zone of copper deposits."}],
  azurite:[{label:"Precipitation from copper-bearing solution",equation:"3Cu²⁺ + 2CO₃²⁻ + 2OH⁻ → Cu₃(CO₃)₂(OH)₂",note:"Occurs alongside the malachite-forming reaction; which one dominates depends on local CO₂ and pH conditions."}],
  gypsum:[{label:"Dehydration to anhydrite (heating or deep burial)",equation:"CaSO₄·2H₂O ⇌ CaSO₄ + 2H₂O",note:"Reversible — anhydrite rehydrates back to gypsum if water becomes available again."}],
  halite:[{label:"Dissolution in water",equation:"NaCl (s) → Na⁺(aq) + Cl⁻(aq)",note:"Simple ionic dissociation — the reaction behind halite's high solubility and the salinity of evaporating brines."}],
  cinnabar:[{label:"Historical roasting reaction for mercury extraction",equation:"HgS + O₂ → Hg + SO₂",note:"An industrial process used historically to extract elemental mercury; now recognized as hazardous and tightly regulated."}],
  galena:[{label:"Roasting (smelting) reaction historically used to extract lead",equation:"2PbS + 3O₂ → 2PbO + 2SO₂",note:"An early stage in traditional lead smelting."}],
  sphalerite:[{label:"Roasting reaction historically used in zinc smelting",equation:"2ZnS + 3O₂ → 2ZnO + 2SO₂",note:"Mirrors the galena roasting reaction; the resulting ZnO is then reduced to metallic zinc."}]
};

/* ===================== router ===================== */
const routes = [];
function route(pattern, handler){ routes.push({pattern,handler}); }
function matchRoute(hash){
  const path = (hash.replace(/^#/,"") || "/").split("?")[0];
  for(const r of routes){
    const keys=[];
    const re = new RegExp("^"+r.pattern.replace(/:[^/]+/g,m=>{keys.push(m.slice(1));return "([^/]+)";})+"$");
    const m = path.match(re);
    if(m){ const params={}; keys.forEach((k,i)=>params[k]=decodeURIComponent(m[i+1])); return {handler:r.handler, params}; }
  }
  return null;
}

function render(){
  const hash = location.hash || "#/";
  const m = matchRoute(hash) || matchRoute("#/404");
  window.scrollTo(0,0);
  document.querySelectorAll("nav.primary a, #mobile-nav a").forEach(a=>{
    const p = a.getAttribute("data-path");
    const active = p==="/" ? hash==="#/" || hash==="" : (hash==="#"+p || hash.indexOf("#"+p+"/")===0 || hash.indexOf("#"+p+"?")===0);
    a.classList.toggle("active",active);
  });
  const moreBtn = document.getElementById("nav-more-btn");
  if(moreBtn){
    moreBtn.classList.toggle("active", !!document.querySelector("#nav-more-menu a.active"));
    document.getElementById("nav-more-menu").classList.add("hide");
    moreBtn.setAttribute("aria-expanded","false");
  }
  document.getElementById("app").innerHTML = m.handler(m.params);
  afterRender(hash);
  syncPressed();
  try{ document.getElementById("app").focus({preventScroll:true}); }catch(e){}
}

function filterMinerals(){
  let list = MINERALS.filter(m=>{
    if(dbState.q){
      const q = dbState.q.toLowerCase();
      const hay = [m.name,ruName(m.name),ruName(m.group),m.formula,m.group,m.className,...m.elements,...elementNames(m),...elementNames(m).map(ruName),...(m.countryIds||[]).map(id=>ruName(COUNTRIES_BY_ID[id].name)),...m.localityIds.map(id=>LOCALITIES_BY_ID[id]?LOCALITIES_BY_ID[id].name+" "+regionName(LOCALITIES_BY_ID[id].regionId)+" "+countryNameOf(LOCALITIES_BY_ID[id]):""),...m.hostRocks.map(id=>ROCKS_BY_ID[id]?ROCKS_BY_ID[id].name:"")].join(" ").toLowerCase();
      if(!hay.includes(q)) return false;
    }
    if(dbState.groups.size && !dbState.groups.has(m.group)) return false;
    if(dbState.systems.size && !dbState.systems.has(m.crystalSystem)) return false;
    if(dbState.verifiedOnly && !m.verifiedKG) return false;
    if(dbState.country && !(m.countryIds||[]).includes(dbState.country)) return false;
    const avg = hAvg(m);
    if(avg < dbState.minH || avg > dbState.maxH) return false;
    return true;
  });
  const sorters = {
    az:(a,b)=>a.name.localeCompare(b.name),
    hardness:(a,b)=>hAvg(a)-hAvg(b),
    density:(a,b)=>(a.density[0]||0)-(b.density[0]||0),
    localities:(a,b)=>b.localityIds.length-a.localityIds.length,
    group:(a,b)=>a.group.localeCompare(b.group)||a.name.localeCompare(b.name)
  };
  list.sort(sorters[dbState.sort]||sorters.az);
  return list;
}
function swatchFromColor(colorStr){
  const s = (colorStr||"").toLowerCase();
  const rules = [
    [/colorless|white|cream/,"#e8e3d6"],[/black|dark gray|steel-gray|steel gray/,"#2b2c26"],
    [/red|ruby|scarlet/,"#a8453a"],[/orange/,"#c07a3f"],[/yellow|citrine|lemon/,"#c9ab4a"],
    [/green|malachite|pistachio/,"#5c9a6e"],[/blue|azure|sapphire/,"#4a76a8"],
    [/purple|violet|amethyst/,"#8a6bb0"],[/pink|rose/,"#c98a9e"],[/brown/,"#8a6440"],
    [/gray|grey|silver/,"#9a9788"],[/gold/,"#c9a13f"],[/copper-red/,"#b56a3e"]
  ];
  for(const [re,hex] of rules) if(re.test(s)) return hex;
  return "#726e60";
}

/* ---- Per-mineral knowledge graph: mineral at center, elements / rocks /
   localities as surrounding rings. Deliberately scoped to one mineral's
   real connections rather than the whole database, so it stays readable. */
function initMineralGraph(m){
  const svg = document.getElementById("kg-graph-svg");
  if(!svg) return;
  const W=680,H=480, cx=W/2, cy=H/2;
  const nodes = [{id:"self",label:m.name,type:"mineral",x:cx,y:cy}];
  const links = [];
  const ringNodes = [];
  m.elements.forEach(sym=>ringNodes.push({id:"el:"+sym,label:sym,type:"element",href:`#/elements?el=${sym}`}));
  m.hostRocks.forEach(rid=>{const r=ROCKS_BY_ID[rid]; if(r) ringNodes.push({id:"rock:"+rid,label:r.name,type:"rock",href:`#/rocks/${rid}`});});
  m.localityIds.slice(0,5).forEach(lid=>{const l=LOCALITIES_BY_ID[lid]; if(l) ringNodes.push({id:"loc:"+lid,label:l.name,type:"locality",href:`#/map?loc=${lid}`});});
  MINERALS.filter(x=>x.id!==m.id && x.group===m.group).slice(0,4).forEach(x=>ringNodes.push({id:"min:"+x.id,label:x.name,type:"mineral2",href:`#/minerals/${x.id}`}));
  const R = 175;
  ringNodes.forEach((n,i)=>{
    const angle = (i/ringNodes.length)*Math.PI*2 - Math.PI/2;
    n.x = cx + Math.cos(angle)*R; n.y = cy + Math.sin(angle)*R;
    nodes.push(n); links.push({a:"self", b:n.id});
  });
  const typeColor = {mineral:"var(--copper)",element:"var(--azurite)",rock:"var(--malachite)",locality:"var(--amber)",mineral2:GROUP_COLOR[m.group]||"var(--copper)"};
  svg.setAttribute("viewBox",`0 0 ${W} ${H}`);
  svg.innerHTML = `
    ${links.map(l=>{const a=nodes.find(n=>n.id===l.a), b=nodes.find(n=>n.id===l.b); return `<line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" stroke="#34362c" stroke-width="1.2"/>`;}).join("")}
    ${nodes.map(n=>{
      const isSelf = n.id==="self";
      const col = isSelf ? "var(--copper)" : typeColor[n.type];
      const r = isSelf?34:24;
      return `<g class="graph-node" ${n.href?`data-href="${n.href}"`:""} style="cursor:${n.href?'pointer':'default'}" transform="translate(${n.x},${n.y})">
        <circle r="${r}" fill="${isSelf?col:'var(--slate)'}" fill-opacity="${isSelf?0.25:1}" stroke="${col}" stroke-width="1.6"/>
        <text text-anchor="middle" dy="4" font-size="${isSelf?11:9.5}" fill="${isSelf?'var(--bone)':'var(--bone-dim)'}" font-family="var(--font-mono)">${esc(n.label.length>14?n.label.slice(0,13)+'…':n.label)}</text>
      </g>`;
    }).join("")}
  `;
  svg.querySelectorAll(".graph-node[data-href]").forEach(g=>g.addEventListener("click",()=>{ location.hash = g.dataset.href; }));
  let view = {x:0,y:0,w:W,h:H};
  function apply(){ svg.setAttribute("viewBox",`${view.x} ${view.y} ${view.w} ${view.h}`); }
  let dragging=false,lastX=0,lastY=0;
  svg.addEventListener("pointerdown",e=>{dragging=true;lastX=e.clientX;lastY=e.clientY;});
  window.addEventListener("pointerup",()=>dragging=false);
  window.addEventListener("pointermove",e=>{
    if(!dragging) return;
    const rect = svg.getBoundingClientRect();
    view.x -= (e.clientX-lastX)*(view.w/rect.width); view.y -= (e.clientY-lastY)*(view.h/rect.height);
    lastX=e.clientX; lastY=e.clientY; apply();
  });
  svg.addEventListener("wheel",e=>{
    e.preventDefault();
    const factor = e.deltaY>0?1.15:0.87;
    const nw = Math.min(W*1.4,Math.max(W*0.35,view.w*factor));
    view.x += (view.w-nw)/2; view.y += (view.h-(nw*(H/W)))/2;
    view.w = nw; view.h = nw*(H/W); apply();
  },{passive:false});
}

function chemistryStory(m){
  const notes = {
    Silicates:`built from strongly covalent Si–O bonds in a repeating tetrahedral framework — the same structural principle behind why many silicates, including this one (Mohs ${hRange(m)}), resist scratching and weathering far better than most other mineral classes.`,
    Carbonates:`held together by a mix of ionic and covalent bonding around the carbonate (CO₃) group that is comparatively easy to break, which is exactly why carbonates like this one are generally soft (Mohs ${hRange(m)}) and react readily with acid.`,
    Sulfides:`bonded through a mix of metallic and covalent character between metal and sulfur atoms, which is why many sulfides — this one included — show a metallic luster and only moderate hardness (Mohs ${hRange(m)}).`,
    Sulfates:`an ionic structure built around the sulfate (SO₄) group, typically giving moderate hardness (Mohs ${hRange(m)}) and clean cleavage along its weaker ionic bonding planes.`,
    Halides:`a simple ionic structure of alternating cations and anions, which explains both its low-to-moderate hardness (Mohs ${hRange(m)}) and its clean, geometric cleavage.`,
    Vanadates:`a structure built around the vanadate (VO₄) group coordinated with metal cations, typically giving moderate hardness (Mohs ${hRange(m)}) and often striking color from the transition-metal or uranyl ions involved.`,
    "Native Elements": m.luster.toLowerCase().includes("metallic")
      ? `held together by metallic bonding — a shared "sea" of electrons around closely packed atoms — which explains both its high density (${dRange(m)}) and its softness and malleability (Mohs ${hRange(m)}): metallic bonds let atomic layers slide past each other without breaking.`
      : `held together by strong, direct covalent bonds between atoms of a single element, which is why its hardness (Mohs ${hRange(m)}) sits at such an unusual extreme for a mineral made of nothing but one element.`,
    Oxides:`an ionic-to-covalent structure of metal and oxygen, typically producing higher hardness and density (Mohs ${hRange(m)}, ${dRange(m)}) than carbonates or sulfates built from similar-sized cations.`,
    Phosphates:`a structure built around the phosphate (PO₄) group, giving it moderate hardness (Mohs ${hRange(m)}) — notably, the same phosphate framework is what makes related calcium-phosphate minerals biologically essential in bone and tooth enamel.`
  };
  return notes[m.group] || `Its bonding and structure (${m.className}) directly shape its measured properties: Mohs hardness ${hRange(m)}, density ${dRange(m)}.`;
}
function storyTimeline(m){
  const h = HISTORY[m.id];
  const items = [];
  items.push({era:"Formation", title:FORMATION_PATHWAYS[m.formationType][0].name+" → "+m.name, text:m.formation});

}

route("/elements", ()=>{

    </div>
    <div id="element-results" style="margin-top:34px"></div>
  </div>
  ${footer()}`;

function renderPeriodicTable(preselect){
  const grid = document.getElementById("ptable");
  if(!grid) return;
  const cells = [];
  for(let p=1;p<=7;p++){
    for(let g=1;g<=18;g++){
      const el = ELEMENTS.find(e=>e.period===p && e.group===g);
      if(el){
        const cnt = elementCount(el.sym);
        cells.push(`<div class="pt-el ${cnt?'has':'dim'}" data-el="${el.sym}" style="border-color:${cnt?CAT_COLORS[el.cat]:'var(--line)'}" title="${el.name}">
          <span class="num">${el.num}</span><span class="sym" style="color:${cnt?'var(--bone)':'var(--bone-faint)'}">${el.sym}</span>
          ${cnt?`<span class="cnt">${cnt}</span>`:""}
        </div>`);
      } else cells.push(`<div class="pt-el empty"></div>`);
    }
  }
  // spacer row then lanthanide/actinide rows (periods 8,9 in our data model)
  cells.push(`<div class="pt-el empty" style="grid-column:1/-1;height:8px"></div>`);
  [8,9].forEach(p=>{
    for(let g=1;g<=18;g++){
      const el = ELEMENTS.find(e=>e.period===p && e.group===g);
      if(el){
        const cnt = elementCount(el.sym);
        cells.push(`<div class="pt-el ${cnt?'has':'dim'}" data-el="${el.sym}" style="border-color:${cnt?CAT_COLORS[el.cat]:'var(--line)'}" title="${el.name}">
          <span class="num">${el.num}</span><span class="sym" style="color:${cnt?'var(--bone)':'var(--bone-faint)'}">${el.sym}</span>
          ${cnt?`<span class="cnt">${cnt}</span>`:""}
        </div>`);
      } else cells.push(`<div class="pt-el empty"></div>`);
    }
  });
  grid.innerHTML = cells.join("");
  grid.querySelectorAll(".pt-el.has").forEach(c=>c.addEventListener("click",()=>showElementResults(c.dataset.el)));
  const qp = new URLSearchParams((location.hash.split("?")[1]||""));
  const pre = preselect || qp.get("el");
  if(pre) showElementResults(pre);
}
function showElementResults(sym){
  const el = ELEMENTS.find(e=>e.sym===sym);
  const list = MINERALS.filter(m=>m.elements.includes(sym));
  const box = document.getElementById("element-results");
  if(!box) return;
  box.innerHTML = `
    <div class="section-head"><div><h2>${el?el.name:sym} <span class="mono" style="color:var(--bone-faint);font-size:16px">(${sym})</span></h2><p>${list.length} mineral${list.length===1?"":"s"} in the database contain ${sym}.</p></div></div>
    <div class="grid-minerals">${list.map(mineralCard).join("") || `<div class="empty-state">No minerals catalogued yet contain this element.</div>`}</div>
  `;
}

const MAP_W=760, MAP_H=520;
const KG_BOUNDS = {lonMin:69.0, lonMax:80.5, latMin:39.0, latMax:43.5};
function coordLabel(l){
  if(!l.coordsKnown) return "coordinates not publicly documented";
  const d = l.coordsApprox?2:4;
  return (l.coordsApprox?"≈ ":"")+l.lat.toFixed(d)+"°N, "+l.lon.toFixed(d)+"°E"+(l.coordsApprox?" (approximate)":"");
}
function proj(lat,lon,w,h){
  const x = ((lon-KG_BOUNDS.lonMin)/(KG_BOUNDS.lonMax-KG_BOUNDS.lonMin))*w;
  const y = h - ((lat-KG_BOUNDS.latMin)/(KG_BOUNDS.latMax-KG_BOUNDS.latMin))*h;
  return [x,y];
}
let mapFilter = {group:"all"};
let mapColorBy = "group"; // group | environment | evidence
let legendOpen = true;
let mapView = {x:0,y:0,w:MAP_W,h:MAP_H};
const ENV_COLOR = {igneous:"var(--copper)",hydrothermal:"var(--azurite)",metamorphic:"var(--malachite)","sedimentary-evaporite":"var(--amber)","weathering-secondary":"var(--rust)","karst-secondary":"#8fb2dd",general:"var(--bone-faint)"};
const ENV_LABEL = {igneous:"Igneous",hydrothermal:"Hydrothermal",metamorphic:"Metamorphic","sedimentary-evaporite":"Sedimentary / evaporitic","weathering-secondary":"Weathering / secondary","karst-secondary":"Karst / carbonate",general:"General"};
const STATUS_RANK = {unverified:0, under_review:1, approximate:2, verified:3};
function localityDominantGroup(l){
  const counts = {};
  l.mineralIds.forEach(id=>{ const g=MINERALS_BY_ID[id]?.group; if(g) counts[g]=(counts[g]||0)+1; });
  let best=null, bestN=0;
  Object.entries(counts).forEach(([g,n])=>{ if(n>bestN){best=g; bestN=n;} });
  return best;
}
function localityDominantEnvironment(l){
  const counts = {};
  l.mineralIds.forEach(id=>{ const t=MINERALS_BY_ID[id]?.formationType; if(t) counts[t]=(counts[t]||0)+1; });
  let best=null, bestN=0;
  Object.entries(counts).forEach(([t,n])=>{ if(n>bestN){best=t; bestN=n;} });

}
function localityEvidenceStatus(l){
  let worst = "verified";
  OCCURRENCES.filter(o=>o.localityId===l.id).forEach(o=>{ if(STATUS_RANK[o.status]<STATUS_RANK[worst]) worst=o.status; });
  return worst;
}
function localityMarkerColor(l){
  if(mapColorBy==="environment"){ const e=localityDominantEnvironment(l); return e?ENV_COLOR[e]:"var(--copper)"; }
  if(mapColorBy==="evidence"){ const s=localityEvidenceStatus(l); return {verified:"var(--malachite)",approximate:"var(--amber)",under_review:"#8fb2dd",unverified:"var(--bone-faint)"}[s]; }
  const g=localityDominantGroup(l); return g?GROUP_COLOR[g]:"var(--copper)";

function localityIsTypeLocality(l){ return l.mineralIds.some(id=>MINERALS_BY_ID[id]?.typeLocality); }

  v.w = Math.min(MAP_W*1.05, Math.max(MAP_W*0.22, v.w));
  v.h = v.w * (MAP_H/MAP_W);
  v.x = Math.min(MAP_W-v.w, Math.max(-MAP_W*0.03, v.x));
  v.y = Math.min(MAP_H-v.h, Math.max(-MAP_H*0.03, v.y));

const GEOLOGY_TOUR = [
  {caption:"Start with the Tian Shan — Kyrgyzstan's mountains are still actively rising, a consequence of the distant India–Asia collision reactivating older faults.", view:()=>({x:0,y:0,w:MAP_W,h:MAP_H}), colorBy:"group"},
  {caption:"Switch to formation environment: hydrothermal minerals cluster along old fault and shear zones, where hot fluids once migrated.", view:()=>({x:0,y:0,w:MAP_W,h:MAP_H}), colorBy:"environment"},
  {caption:"Zoom into Khaidarkan — a hydrothermal antimony-mercury system, and one of the richest secondary-mineral sites in the database.", view:()=>{const [x,y]=proj(39.94,71.33,MAP_W,MAP_H); return clampMapView({x:x-MAP_W*0.16,y:y-MAP_H*0.16,w:MAP_W*0.32,h:MAP_H*0.32*(MAP_H/MAP_W)});}, colorBy:"environment"},
  {caption:"Now look at Tyuya-Muyun — a karst cave system in limestone where oxidizing groundwater built an unusually rich vanadate suite. Open its rock and mineral pages to see the full chain.", view:()=>{const [x,y]=proj(40.3578,72.5856,MAP_W,MAP_H); return clampMapView({x:x-MAP_W*0.16,y:y-MAP_H*0.16,w:MAP_W*0.32,h:MAP_H*0.32*(MAP_H/MAP_W)});}, colorBy:"environment"},
  {caption:"Switch back to mineral group coloring, and click any marker to explore its minerals, host rocks, and sources.", view:()=>({x:0,y:0,w:MAP_W,h:MAP_H}), colorBy:"group"}
];
let tourStep = 0;
function startGeologyTour(){
  tourStep = 0;
  showTourStep();
}
function showTourStep(){
  const box = document.getElementById("map-tour-caption");
  if(!box) return;
  const step = GEOLOGY_TOUR[tourStep];
  mapColorBy = step.colorBy; renderMapLegend();
  const target = step.view();
  const start = {...mapView};
  const t0 = performance.now(), dur=650;
  function anim(t){
    const p=Math.min(1,(t-t0)/dur), e=1-Math.pow(1-p,3);
    mapView.x=start.x+(target.x-start.x)*e; mapView.y=start.y+(target.y-start.y)*e;
    mapView.w=start.w+(target.w-start.w)*e; mapView.h=start.h+(target.h-start.h)*e;
    applyMapViewBox(); if(p<1) requestAnimationFrame(anim);
  }
  requestAnimationFrame(anim);
  document.querySelectorAll(".loc-marker").forEach(m=>{
    const col = localityMarkerColor(LOCALITIES_BY_ID[m.dataset.loc]);
    m.querySelectorAll("circle").forEach(c=>{ if(!c.classList.contains("pulse-ring")) c.setAttribute("fill",col.startsWith("var")||c.getAttribute("opacity")===".16"?col:c.getAttribute("fill")); });
  });
  box.classList.remove("hide");
  box.innerHTML = `
    <div class="tour-step-label">STEP ${tourStep+1} OF ${GEOLOGY_TOUR.length}</div>
    <p>${esc(step.caption)}</p>
    <div class="tour-controls">
      ${tourStep>0?`<button class="btn btn-ghost" id="tour-prev">← Back</button>`:"<span></span>"}
      ${tourStep<GEOLOGY_TOUR.length-1?`<button class="btn btn-primary" id="tour-next">Next →</button>`:`<button class="btn btn-primary" id="tour-end">Finish</button>`}
      <button class="btn btn-ghost" id="tour-skip">Skip tour</button>
    </div>
  `;
  const nextBtn = document.getElementById("tour-next"), prevBtn=document.getElementById("tour-prev"), endBtn=document.getElementById("tour-end"), skipBtn=document.getElementById("tour-skip");
  if(nextBtn) nextBtn.addEventListener("click",()=>{tourStep++; showTourStep();});
  if(prevBtn) prevBtn.addEventListener("click",()=>{tourStep--; showTourStep();});
  if(endBtn) endBtn.addEventListener("click",()=>{ box.classList.add("hide"); renderMap(); });
  if(skipBtn) skipBtn.addEventListener("click",()=>{ box.classList.add("hide"); renderMap(); });
}
function wireMapInteractions(wrap){
  const svg = document.getElementById("kg-map-svg");
  if(!svg) return;
  wrap.dataset.dragged = "0";
  let dragging=false, startX=0, startY=0, moved=0;
  function toSvgPoint(clientX,clientY){
    const rect = svg.getBoundingClientRect();
    const px = (clientX-rect.left)/rect.width, py=(clientY-rect.top)/rect.height;
    return [mapView.x+px*mapView.w, mapView.y+py*mapView.h];
  }
  svg.addEventListener("pointerdown", e=>{ dragging=true; moved=0; startX=e.clientX; startY=e.clientY; wrap.dataset.dragged="0"; svg.style.cursor="grabbing"; });
  window.addEventListener("pointerup", ()=>{ dragging=false; svg.style.cursor="grab"; setTimeout(()=>{wrap.dataset.dragged="0";},10); });
  window.addEventListener("pointermove", e=>{
    if(!dragging) return;
    const dx = e.clientX-startX, dy = e.clientY-startY;
    moved += Math.abs(dx)+Math.abs(dy);

    const rect = svg.getBoundingClientRect();
    mapView.x -= dx*(mapView.w/rect.width);
    mapView.y -= dy*(mapView.h/rect.height);
    clampMapView(mapView); applyMapViewBox();
    startX=e.clientX; startY=e.clientY;
  });
  svg.addEventListener("wheel", e=>{
    e.preventDefault();
    const [fx,fy] = toSvgPoint(e.clientX,e.clientY);
    const factor = e.deltaY>0 ? 1.15 : 0.87;
    const nw = mapView.w*factor;
    mapView.x = fx - (fx-mapView.x)*(nw/mapView.w);
    mapView.y = fy - (fy-mapView.y)*(nw/mapView.w);
    mapView.w = nw; mapView.h = nw*(MAP_H/MAP_W);
    clampMapView(mapView); applyMapViewBox();
  }, {passive:false});
  document.getElementById("map-zoom-in").addEventListener("click", ()=>{ zoomMapBy(0.8); });
  document.getElementById("map-zoom-out").addEventListener("click", ()=>{ zoomMapBy(1.25); });
  document.getElementById("map-zoom-reset").addEventListener("click", ()=>{ mapView={x:0,y:0,w:MAP_W,h:MAP_H}; applyMapViewBox(); });
}
function zoomMapBy(factor){
  const cx = mapView.x+mapView.w/2, cy = mapView.y+mapView.h/2;
  const nw = mapView.w*factor;
  mapView.x = cx-nw/2; mapView.y = cy-(nw*(MAP_H/MAP_W))/2;
  mapView.w = nw; mapView.h = nw*(MAP_H/MAP_W);
  clampMapView(mapView); applyMapViewBox();
}
function flyToPoint(px,py){
  const targetW = Math.min(mapView.w, MAP_W*0.42);
  const start = {...mapView};
  const end = clampMapView({x:px-targetW/2, y:py-targetW*(MAP_H/MAP_W)/2, w:targetW, h:targetW*(MAP_H/MAP_W)});
  const t0 = performance.now(), dur = 550;
  function step(t){
    const p = Math.min(1,(t-t0)/dur), e = 1-Math.pow(1-p,3);
    mapView.x = start.x+(end.x-start.x)*e; mapView.y = start.y+(end.y-start.y)*e;
    mapView.w = start.w+(end.w-start.w)*e; mapView.h = start.h+(end.h-start.h)*e;
    applyMapViewBox();
    if(p<1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}

function trimSentences(text, max){
  const t = String(text||""); if(t.length<=max) return t;
  const cut = t.slice(0,max); const i = Math.max(cut.lastIndexOf(". "), cut.lastIndexOf("; "));
  return (i>60 ? cut.slice(0,i+1) : cut.replace(/\s+\S*$/,"")+"…");
}

const COLL_KEY = "kma_collection", COLL_SEQ = "kma_collection_seq";
const COLL_STATUS = [["confident","Confident identification"],["tentative","Tentative identification"],["unknown","Not yet identified"]];
const COLL_SOURCE = [["tool","Field tests / Atlas Identify tool"],["lab","Laboratory analysis (XRD, microprobe…)"],["expert","Expert or museum"],["label","Seller's or collector's label"],["own","My own judgement"]];
const COLL_PHOTO_PREFIX = "data:image/jpeg;base64,";
function collClean(x){
  const str=(v,n)=>typeof v==="string" ? v.slice(0,n) : "";
  return {
    id:str(x.id,40), mineralId: MINERALS_BY_ID[x.mineralId] ? x.mineralId : "", title:str(x.title,120),
    localityId: LOCALITIES_BY_ID[x.localityId] ? x.localityId : "", place:str(x.place,160), date:str(x.date,10),
    status: COLL_STATUS.some(o=>o[0]===x.status) ? x.status : "unknown", source: COLL_SOURCE.some(o=>o[0]===x.source) ? x.source : "own",
    notes:str(x.notes,1500), photo:(typeof x.photo==="string" && x.photo.indexOf(COLL_PHOTO_PREFIX)===0 && x.photo.length<400000) ? x.photo : "", created:str(x.created,30)
  };
}
function collLoad(){ try{ const d=JSON.parse(localStorage.getItem(COLL_KEY)||"[]"); return Array.isArray(d) ? d.filter(x=>x && typeof x==="object" && x.id).map(collClean) : []; }catch(e){ return []; } }
function collSave(list){ try{ localStorage.setItem(COLL_KEY, JSON.stringify(list)); return true; }catch(e){ return false; } }
function collNextId(){ let n=0; try{ n=parseInt(localStorage.getItem(COLL_SEQ)||"0",10)||0; }catch(e){} n++; try{ localStorage.setItem(COLL_SEQ,String(n)); }catch(e){} return "MY-"+String(n).padStart(4,"0"); }
function collCsv(list){
  const q = v=>'"'+String(v==null?"":v).replace(/"/g,'""')+'"';
  const head = ["Specimen ID","Mineral","Formula","Title","Locality (Atlas)","Locality (free text)","Date","Identification status","Identified by","Notes"];
  const rows = list.map(c=>{ const m=MINERALS_BY_ID[c.mineralId], l=LOCALITIES_BY_ID[c.localityId]; return [c.id,m?m.name:"",m?m.formula:"",c.title,l?l.name:"",c.place,c.date,(COLL_STATUS.find(o=>o[0]===c.status)||[])[1]||"",(COLL_SOURCE.find(o=>o[0]===c.source)||[])[1]||"",c.notes].map(q).join(","); });
  return head.map(q).join(",")+"\n"+rows.join("\n");
}
