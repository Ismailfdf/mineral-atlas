<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kyrgyzstan Mineral Atlas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
:root{
  --charcoal:#121310;
  --charcoal-2:#0d0e0b;
  --slate:#1b1d17;
  --slate-2:#22241c;
  --line:#34362c;
  --line-soft:#26281f;
  --bone:#eae4d6;
  --bone-dim:#b3ac99;
  --bone-faint:#8f8a7b;
  --copper:#c2814a;
  --malachite:#57a17f;
  --azurite:#5a83b3;
  --amber:#cf9b3f;
  --rust:#a85f4f;
  --g-silicate:#7ea3d1;
  --g-carbonate:#5fae87;
  --g-sulfide:#cfa23f;
  --g-sulfate:#b490c9;
  --g-halide:#6fc0bd;
  --g-vanadate:#cf8451;
  --g-native:#d8bd6c;
  --g-oxide:#b06b5f;
  --g-phosphate:#8fae6f;
  --g-tungstate:#7a9bc4;
  --g-chromate:#d96f52;
  --g-molybdate:#c4a37a;
  --font-display:"Spectral", Georgia, "Times New Roman", serif;
  --font-body:"Inter", -apple-system, "Segoe UI", sans-serif;
  --font-mono:"IBM Plex Mono", "SFMono-Regular", Consolas, monospace;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  box-sizing:border-box;
}
:root:not([data-theme="light"]){ color-scheme: dark; }
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(64px + env(safe-area-inset-top,0px));}
html,body{height:100%;}
body{
  margin:0;background:var(--charcoal);color:var(--bone);
  font-family:var(--font-body);font-size:15px;line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.5;
  background-image:
    radial-gradient(ellipse 900px 500px at 12% -10%, rgba(87,161,127,.07), transparent 60%),
    radial-gradient(ellipse 800px 600px at 100% 0%, rgba(194,129,74,.06), transparent 55%);
}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer}
::selection{background:var(--copper);color:#181812}
img,svg{max-width:100%;display:block}
.wrap{max-width:1180px;margin:0 auto;padding:0 28px}
@media(max-width:640px){.wrap{padding:0 18px}}
.mono{font-family:var(--font-mono)}
.hide{display:none !important}
h1,h2,h3,h4{font-family:var(--font-display);font-weight:600;margin:0;color:var(--bone)}
p{margin:0}
.overflow-x{overflow-x:auto}

/* ---------- Top bar ---------- */
#topbar{
  position:sticky;top:0;z-index:50;
  padding-top:env(safe-area-inset-top,0px);
  background:rgba(13,14,11,.86);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line-soft);
}
.topbar-inner{max-width:1180px;margin:0 auto;padding:0 28px;height:60px;display:flex;align-items:center;gap:26px}
@media(max-width:640px){.topbar-inner{padding:0 18px}}
.brand{display:flex;align-items:center;gap:10px;flex-shrink:0}
.brand-mark{width:26px;height:26px;flex-shrink:0}
.brand-text{font-family:var(--font-display);font-weight:600;font-size:17px;letter-spacing:.2px;color:var(--bone)}
.brand-text small{display:block;font-family:var(--font-mono);font-size:9.5px;color:var(--bone-faint);letter-spacing:.08em;font-weight:400;margin-top:1px}
nav.primary{display:flex;gap:2px;flex:1;align-items:center}
nav.primary::-webkit-scrollbar{display:none}
nav.primary a{
  padding:8px 12px;border-radius:5px;font-size:13.5px;color:var(--bone-dim);white-space:nowrap;
  border-bottom:2px solid transparent;transition:color .15s;
}
nav.primary a:hover{color:var(--bone)}
nav.primary a.active{color:var(--bone);border-bottom-color:var(--malachite)}
.search-box{position:relative;flex-shrink:0;width:220px}
@media(max-width:900px){.search-box{width:150px}}
.hamburger{display:none;background:transparent;border:1px solid var(--line);border-radius:6px;width:36px;height:36px;align-items:center;justify-content:center;flex-shrink:0;color:var(--bone)}
@media(max-width:640px){
  nav.primary{display:none}
  .search-box{width:auto;flex:1}
  .hamburger{display:flex}
}
#mobile-nav{display:none;flex-direction:column;border-bottom:1px solid var(--line-soft);background:var(--charcoal-2)}
#mobile-nav.open{display:flex}
#mobile-nav a{padding:13px 18px;font-size:14.5px;color:var(--bone-dim);border-bottom:1px solid var(--line-soft)}
#mobile-nav a.active{color:var(--malachite)}
.search-box input{
  width:100%;background:var(--slate);border:1px solid var(--line);border-radius:6px;
  color:var(--bone);padding:7px 10px 7px 30px;font-size:13px;font-family:var(--font-body);
}
.search-box input:focus{outline:none;border-color:var(--malachite)}
.search-box svg{position:absolute;left:9px;top:50%;transform:translateY(-50%);opacity:.5;pointer-events:none}
#search-results{
  position:absolute;top:calc(100% + 8px);right:0;width:340px;max-height:70vh;overflow:auto;
  background:var(--slate-2);border:1px solid var(--line);border-radius:8px;box-shadow:0 20px 50px rgba(0,0,0,.5);
  padding:6px;z-index:80;
}
@media(max-width:640px){#search-results{width:calc(100vw - 36px);right:-9px}}
.sr-group{padding:8px 10px 4px;font-size:10.5px;letter-spacing:.06em;color:var(--bone-faint);font-family:var(--font-mono)}
.sr-item{display:block;padding:8px 10px;border-radius:6px;font-size:13.5px}
.sr-item:hover{background:var(--slate)}
.sr-item .sr-sub{display:block;font-size:11.5px;color:var(--bone-faint);margin-top:1px}
.sr-empty{padding:14px 10px;color:var(--bone-faint);font-size:13px}

/* ---------- buttons / chips ---------- */
.btn{
  display:inline-flex;align-items:center;gap:8px;padding:11px 20px;border-radius:6px;
  font-size:14px;font-weight:600;border:1px solid transparent;transition:transform .12s, background .15s, border-color .15s;
}
.btn:active{transform:scale(.98)}
.btn-primary{background:var(--malachite);color:#0e1610}
.btn-primary:hover{background:#63ae8b}
.btn-ghost{background:transparent;border-color:var(--line);color:var(--bone)}
.btn-ghost:hover{border-color:var(--bone-faint)}
.chip{
  display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:20px;
  font-size:12.5px;border:1px solid var(--line);color:var(--bone-dim);background:var(--slate);
}
.chip.on{border-color:var(--malachite);color:var(--bone);background:rgba(87,161,127,.12)}
.badge{
  display:inline-flex;align-items:center;gap:5px;font-family:var(--font-mono);font-size:10.5px;
  padding:2px 7px;border-radius:4px;letter-spacing:.03em;
}
.badge-verified{background:rgba(87,161,127,.15);color:var(--malachite);border:1px solid rgba(87,161,127,.35)}
.badge-approx{background:rgba(207,155,63,.12);color:var(--amber);border:1px solid rgba(207,155,63,.35)}
.badge-review{background:rgba(90,131,179,.12);color:#8fb2dd;border:1px solid rgba(90,131,179,.35)}
.badge-unverified{background:rgba(207,159,63,.1);color:var(--amber);border:1px solid rgba(207,159,63,.3)}
.badge-type{background:rgba(90,131,179,.15);color:#8fb2dd;border:1px solid rgba(90,131,179,.35)}

/* ---------- hero ---------- */
.hero{position:relative;padding:76px 0 60px;border-bottom:1px solid var(--line-soft);overflow:hidden}
.hero .wrap{position:relative;z-index:2;display:grid;grid-template-columns:1.1fr .9fr;gap:50px;align-items:center}
@media(max-width:880px){.hero .wrap{grid-template-columns:1fr}.hero{padding:44px 0 40px}}
.eyebrow{font-family:var(--font-mono);font-size:11.5px;color:var(--malachite);letter-spacing:.04em;margin-bottom:16px;display:flex;align-items:center;gap:8px}
.eyebrow::before{content:"";width:16px;height:1px;background:var(--malachite)}
.hero h1{font-size:clamp(34px,5vw,54px);line-height:1.05;letter-spacing:-.01em}
.hero p.lead{margin-top:18px;font-size:17px;color:var(--bone-dim);max-width:46ch;line-height:1.6}
.hero-ctas{margin-top:30px;display:flex;gap:12px;flex-wrap:wrap}
.hero-search{margin-top:26px;max-width:440px}
.hero-search-inner{display:flex;border:1px solid var(--line);border-radius:8px;background:var(--slate);overflow:hidden}
.hero-search-inner input{flex:1;background:transparent;border:none;color:var(--bone);padding:14px 16px;font-size:14.5px}
.hero-search-inner input:focus{outline:none}
.hero-search-inner button{background:var(--slate-2);border:none;border-left:1px solid var(--line);padding:0 18px;color:var(--bone-dim)}
.hero-visual{aspect-ratio:1/1;position:relative}
.stats-strip{border-bottom:1px solid var(--line-soft);background:var(--charcoal-2)}
.stats-grid{display:grid;grid-template-columns:repeat(5,1fr);}
@media(max-width:880px){.stats-grid{grid-template-columns:repeat(2,1fr)}}
.stat-cell{padding:26px 24px;border-right:1px solid var(--line-soft)}
.stat-cell:last-child{border-right:none}
@media(max-width:880px){.stat-cell:nth-child(2n){border-right:none}.stat-cell{border-bottom:1px solid var(--line-soft)}}
.stat-num{font-family:var(--font-display);font-size:30px;color:var(--bone);font-variant-numeric:tabular-nums}
.stat-label{font-size:12px;color:var(--bone-faint);margin-top:3px}

/* ---------- sections ---------- */
section.block{padding:64px 0;border-bottom:1px solid var(--line-soft)}
.section-head{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;margin-bottom:30px;flex-wrap:wrap}
.section-head h2{font-size:26px}
.section-head p{color:var(--bone-faint);font-size:13.5px;margin-top:6px}
.page-head{padding:46px 0 30px}
.page-head h1{font-size:clamp(28px,4vw,40px)}
.page-head p{color:var(--bone-dim);margin-top:12px;max-width:60ch;font-size:15px}
.crumb{font-size:12.5px;color:var(--bone-faint);margin-bottom:14px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.crumb a:hover{color:var(--bone)}
.crumb .sep{opacity:.5}

/* ---------- mineral card ---------- */
.grid-minerals{display:grid;grid-template-columns:repeat(auto-fill,minmax(255px,1fr));gap:16px}
.m-card{
  border:1px solid var(--line);border-radius:3px;background:var(--slate);position:relative;overflow:hidden;
  transition:border-color .15s,transform .15s;display:flex;flex-direction:column;
}
.m-card:hover{border-color:var(--bone-faint);transform:translateY(-2px)}
.m-card-top{height:4px}
.m-card-body{padding:16px 17px 15px;display:flex;flex-direction:column;gap:10px;flex:1}
.m-card-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.m-card-head h3{font-size:17.5px}
.m-card-id{font-family:var(--font-mono);font-size:10px;color:var(--bone-faint)}
.m-card-formula{font-family:var(--font-mono);font-size:13px;color:var(--bone-dim)}
.m-card-desc{font-size:12.8px;color:var(--bone-dim);line-height:1.55;flex:1}
.m-card-meta{display:flex;flex-wrap:wrap;gap:6px;font-size:11px}
.tag{background:var(--slate-2);border:1px solid var(--line);color:var(--bone-dim);padding:3px 8px;border-radius:4px;font-family:var(--font-mono)}
.m-card-foot{display:flex;justify-content:space-between;align-items:center;padding-top:10px;border-top:1px solid var(--line-soft);font-size:11.5px;color:var(--bone-faint)}

/* ---------- filters ---------- */
.db-layout{display:grid;grid-template-columns:230px 1fr;gap:34px;align-items:start}
@media(max-width:860px){.db-layout{grid-template-columns:1fr}}
.filter-panel{border:1px solid var(--line);border-radius:6px;background:var(--slate);padding:18px;position:sticky;top:76px}
@media(max-width:860px){.filter-panel{position:static}}
.filter-group{margin-bottom:20px}
.filter-group:last-child{margin-bottom:0}
.filter-group h4{font-size:11.5px;letter-spacing:.03em;color:var(--bone-faint);margin-bottom:9px;font-family:var(--font-mono);font-weight:500}
.filter-opts{display:flex;flex-wrap:wrap;gap:6px}
.f-toolbar{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-bottom:16px;flex-wrap:wrap}
.f-count{font-size:13px;color:var(--bone-faint)}
.sortsel{background:var(--slate);border:1px solid var(--line);color:var(--bone);padding:8px 10px;border-radius:6px;font-size:13px}
.sortsel:focus{outline:none;border-color:var(--malachite)}
input.sortsel{font-family:var(--font-body)}
.range-row{display:flex;gap:8px;align-items:center}
.range-row input[type=range]{flex:1;accent-color:var(--malachite)}
.range-val{font-family:var(--font-mono);font-size:11.5px;color:var(--bone-dim);width:60px;text-align:right}
.search-field{position:relative}
.search-field input{width:100%;background:var(--charcoal-2);border:1px solid var(--line);border-radius:6px;padding:9px 10px;color:var(--bone);font-size:13px}
.empty-state{text-align:center;padding:60px 20px;color:var(--bone-faint)}
.empty-state h3{color:var(--bone-dim);margin-bottom:8px;font-size:17px}

/* ---------- mineral detail ---------- */
.detail-head{display:grid;grid-template-columns:170px 1fr;gap:28px;align-items:center;margin-bottom:8px}
@media(max-width:640px){.detail-head{grid-template-columns:110px 1fr}}
.detail-icon-box{aspect-ratio:1;border:1px solid var(--line);border-radius:6px;background:var(--slate);display:flex;align-items:center;justify-content:center;padding:14px}
.detail-title-row{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.detail-title-row h1{font-size:clamp(28px,4vw,42px)}
.detail-formula{font-family:var(--font-mono);font-size:18px;color:var(--bone-dim)}
.detail-badges{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.detail-tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:34px 0 26px;overflow-x:auto}
.detail-tab{padding:10px 16px;font-size:13.5px;font-family:var(--font-body);color:var(--bone-faint);white-space:nowrap;background:none;border:none;border-bottom:2px solid transparent;cursor:pointer;margin-bottom:-1px;transition:color .15s,border-color .15s}
.detail-tab:hover{color:var(--bone)}
.detail-tab.active{color:var(--bone);border-bottom-color:var(--copper)}
.prop-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.prop-cell{background:var(--slate);padding:14px 16px}
.prop-cell .k{font-size:10.5px;color:var(--bone-faint);font-family:var(--font-mono);letter-spacing:.03em;margin-bottom:5px}
.prop-cell .v{font-size:14.5px;color:var(--bone)}
.prose{font-size:14.5px;line-height:1.75;color:var(--bone-dim);max-width:74ch}
.prose + .prose{margin-top:14px}
.prose h4{color:var(--bone);font-size:15px;margin:22px 0 8px;font-family:var(--font-body);font-weight:600}
.elem-comp{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}
.elem-pill{border:1px solid var(--line);background:var(--slate);border-radius:6px;padding:10px 14px;min-width:74px;text-align:center}
.elem-pill .sym{font-family:var(--font-mono);font-size:19px;color:var(--copper)}
.elem-pill .nm{font-size:10px;color:var(--bone-faint);margin-top:2px}
.callout{border:1px solid var(--line);border-left:3px solid var(--copper);background:var(--slate);padding:14px 16px;border-radius:0 6px 6px 0;font-size:13.5px;color:var(--bone-dim);margin:16px 0}
.callout.warn{border-left-color:var(--amber)}
.callout.ok{border-left-color:var(--malachite)}
.discover-row{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px}
.discover-chip{display:flex;align-items:center;gap:9px;flex-shrink:0;background:var(--slate);border:1px solid var(--line);border-radius:20px;padding:7px 14px 7px 8px;font-size:13px;color:var(--bone-dim);white-space:nowrap}
.discover-chip:hover{border-color:var(--bone-faint);color:var(--bone)}
.stepper-track{display:flex;align-items:center;overflow-x:auto;padding-bottom:8px;gap:2px}
.stepper-node{display:flex;flex-direction:column;align-items:center;gap:8px;background:none;border:none;padding:4px 10px;flex-shrink:0;opacity:.55}
.stepper-node.active,.stepper-node.done{opacity:1}
.stepper-dot{width:30px;height:30px;border-radius:50%;border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;font-family:var(--font-mono);font-size:12px;color:var(--bone-dim)}
.stepper-node.active .stepper-dot{border-color:var(--copper);color:var(--copper);background:rgba(194,129,74,.12)}
.stepper-node.done .stepper-dot{border-color:var(--malachite);color:var(--malachite)}
.stepper-label{font-size:11px;color:var(--bone-dim);white-space:nowrap}
.stepper-arrow{color:var(--bone-faint);flex-shrink:0}
.process-card{border:1px solid var(--line);background:var(--slate);border-radius:8px;padding:20px;margin-top:6px}
#kg-graph-wrap{border:1px solid var(--line);border-radius:8px;background:var(--charcoal-2);overflow:hidden}
#kg-graph-svg{width:100%;height:420px;cursor:grab;touch-action:none}
.reaction-card{border:1px solid var(--line);background:var(--slate);border-radius:6px;padding:14px 16px;margin-bottom:10px}
.locality-row,.locality-row *,.source-list li,.source-list li *{overflow-wrap:anywhere}

.skip-link{position:absolute;left:-9999px;top:8px;background:var(--malachite);color:#0d0e0b;padding:8px 14px;border-radius:6px;font-size:13px;z-index:200}
.skip-link:focus{left:12px}
#app:focus{outline:none}
.otd{display:flex;gap:24px;align-items:center;border:1px solid var(--line);background:var(--slate);border-radius:10px;padding:24px 28px}
.otd-icon{width:96px;height:96px;flex-shrink:0;border:1px solid var(--line);border-radius:10px;background:var(--charcoal-2);display:flex;align-items:center;justify-content:center;padding:16px}
.otd-body h2{font-size:26px;margin:4px 0 8px}
.otd-body h2 a{color:var(--bone)}
.otd-body h2 .mono{font-size:14px;color:var(--bone-faint);margin-left:6px}
@media(max-width:700px){.otd{flex-direction:column;align-items:flex-start;padding:20px}}
.coll-toolbar{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.coll-toolbar-btns{display:flex;gap:8px;flex-wrap:wrap}
.coll-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:4px 16px}
.coll-card{align-items:flex-start}
.coll-thumb{overflow:hidden;padding:0}
.coll-thumb img{width:100%;height:100%;object-fit:cover}
.coll-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.coll-actions .btn{padding:5px 10px;font-size:12px}
.coll-del{border-color:rgba(168,95,79,.5)}
.gl-card{border:1px solid var(--line);background:var(--slate);border-radius:8px;padding:18px 22px;margin-bottom:12px}
.gl-card h3{font-size:19px;margin-bottom:10px}
.gl-card p{font-size:14px;line-height:1.65;color:var(--bone-dim);margin:0 0 8px}
.gl-tag{display:inline-block;font-family:var(--font-mono);font-size:10px;letter-spacing:.03em;color:var(--copper);margin-right:10px;text-transform:uppercase}
.label-sheet{background:#fff;color:#111;border:1px solid #bbb;border-radius:6px;padding:20px 24px;max-width:640px}
.label-head{display:flex;justify-content:space-between;align-items:baseline;border-bottom:1.5px solid #111;padding-bottom:6px;margin-bottom:12px}
.label-brand{font-family:var(--font-mono);font-size:10px;letter-spacing:.08em;color:#333}
.label-id{font-family:var(--font-mono);font-size:12px;font-weight:600}
.label-main{display:flex;gap:20px;align-items:flex-start}
.label-text{flex:1;min-width:0}
.label-sheet h2{font-family:var(--font-display);font-size:28px;color:#111;margin:0 0 2px}
.label-formula{font-family:var(--font-mono);font-size:14px;color:#333;margin-bottom:2px}
.label-sub{font-size:12px;color:#555;margin-bottom:10px}
.label-table{border-collapse:collapse;font-size:12px;width:100%}
.label-table th{text-align:left;font-weight:600;color:#333;padding:3px 10px 3px 0;vertical-align:top;white-space:nowrap}
.label-table td{padding:3px 0;color:#111}
.label-qr{text-align:center;flex-shrink:0;width:136px}
.label-url{font-family:var(--font-mono);font-size:8px;color:#555;word-break:break-all;margin-top:4px}

.photo-links{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}

.photo-upload{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:10px 0 14px}
.user-photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}

.user-photo-del{position:absolute;top:6px;right:6px;width:26px;height:26px;border-radius:50%;border:1px solid var(--line);background:rgba(13,14,11,.85);color:var(--bone);font-size:12px;line-height:1}

.photo-toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:18px}
.photo-list{display:flex;flex-direction:column;gap:8px}

.photo-row-main{display:flex;flex-direction:column;min-width:0}

.story-section{display:grid;grid-template-columns:56px 1fr;gap:18px;margin-bottom:34px;padding-bottom:34px;border-bottom:1px solid var(--line-soft)}
.story-section:last-of-type{border-bottom:none}
.notebook-card{border:1px solid var(--line);background:var(--slate);border-radius:8px;padding:22px}
.notebook-head{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.notebook-head h3{font-size:17px}
.chall-frame{max-width:760px}
.ident-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;margin-top:16px}
.ident-field{border:1px solid var(--line);background:var(--slate);border-radius:6px;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;gap:10px}

.rock-opt{display:flex;align-items:center;gap:9px;border:1px solid var(--line);background:var(--slate);border-radius:6px;padding:11px 14px;font-size:13px;color:var(--bone-dim);cursor:pointer}
.rock-opt:hover{border-color:var(--bone-faint)}
.story-num{font-family:var(--font-display);font-size:28px;color:var(--line);font-weight:600}
.story-section h3{font-size:18px;margin-bottom:10px}
@media(max-width:640px){.story-section{grid-template-columns:1fr;gap:6px}.story-num{font-size:20px}}
.source-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}

.locality-row{border:1px solid var(--line);background:var(--slate);border-radius:6px;padding:16px 18px;margin-bottom:12px}
.locality-row-head{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:baseline}
.locality-row h4{font-size:15px;color:var(--bone)}

/* ---------- compare ---------- */
.compare-picker{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:28px}
.compare-slot select{background:var(--slate);border:1px solid var(--line);color:var(--bone);padding:10px 12px;border-radius:6px;font-size:13.5px;min-width:180px}
table.compare-table{width:100%;border-collapse:collapse;font-size:13.5px}
table.compare-table th,table.compare-table td{border:1px solid var(--line);padding:12px 14px;text-align:left;vertical-align:top}
table.compare-table th{background:var(--slate-2);color:var(--bone-faint);font-weight:500;font-family:var(--font-mono);font-size:11px;letter-spacing:.02em;white-space:nowrap}
table.compare-table td.prop-name{background:var(--slate);color:var(--bone-dim);font-family:var(--font-mono);font-size:11.5px;white-space:nowrap}
table.compare-table tr td.diff{color:var(--amber)}

/* ---------- periodic table ---------- */
.ptable{display:grid;grid-template-columns:repeat(18,minmax(0,1fr));gap:3px;margin:0 auto;max-width:980px}
.pt-el{
  aspect-ratio:1;border-radius:3px;border:1px solid var(--line);background:var(--slate);
  display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;
  font-family:var(--font-mono);transition:transform .12s;
}
.pt-el.has{cursor:pointer}
.pt-el.has:hover{transform:scale(1.12);z-index:5;border-color:var(--bone)}
.pt-el.empty{visibility:hidden}
.pt-el .num{position:absolute;top:2px;left:3px;font-size:7px;color:var(--bone-faint)}
.pt-el .sym{font-size:13px;color:var(--bone)}
.pt-el .cnt{position:absolute;bottom:2px;right:3px;font-size:7px;color:var(--copper)}
.pt-el.dim{opacity:.35}
@media(max-width:760px){.ptable{gap:2px}.pt-el .sym{font-size:9px}.pt-el .num{display:none}}
.pt-legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:20px;font-size:12px;color:var(--bone-faint)}
.pt-legend span{display:inline-flex;align-items:center;gap:6px}
.pt-legend i{width:10px;height:10px;border-radius:2px;display:inline-block}

/* ---------- map ---------- */
.map-shell{display:grid;grid-template-columns:1fr 340px;gap:0;border:1px solid var(--line);border-radius:8px;overflow:hidden}
@media(max-width:860px){.map-shell{grid-template-columns:1fr}}
.map-svg-wrap{background:var(--charcoal-2);position:relative;min-height:460px}
.map-panel{background:var(--slate);border-left:1px solid var(--line);padding:20px;max-height:640px;overflow:auto}
@media(max-width:860px){.map-panel{border-left:none;border-top:1px solid var(--line)}}
.map-panel h3{font-size:16px;margin-bottom:4px}
.loc-marker{cursor:pointer}
.loc-marker circle{transition:r .12s}
.loc-marker:hover,.loc-cluster:hover{filter:brightness(1.3)}
.loc-cluster{cursor:pointer}
#kg-map-svg.zoomed-out .in-cluster{display:none}
#kg-map-svg:not(.zoomed-out) .loc-cluster{display:none}
.loc-marker.active circle{fill:var(--copper)}
.loc-marker.is-type .pulse-ring{animation:mapPulse 2.6s ease-out infinite}
@keyframes mapPulse{0%{r:8;opacity:.55}100%{r:22;opacity:0}}
@media(prefers-reduced-motion:reduce){.loc-marker.is-type .pulse-ring{animation:none}}
.map-controls{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.map-zoom-controls{position:absolute;top:12px;right:12px;display:flex;flex-direction:column;gap:4px;z-index:5}
.map-zoom-controls button{width:30px;height:30px;background:rgba(27,29,23,.9);border:1px solid var(--line);color:var(--bone);border-radius:5px;font-size:15px;line-height:1}
.map-zoom-controls button:hover{border-color:var(--bone-faint)}
#kg-map-svg{cursor:grab;touch-action:none}
.map-legend{margin-top:16px;display:flex;flex-direction:column;gap:8px;font-size:12px;color:var(--bone-faint)}
.map-legend-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.map-toprow{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-bottom:6px}
.map-toprow .map-controls{flex:1;flex-direction:column;gap:10px;margin-bottom:12px}
.map-filter-group{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.map-filter-label{font-family:var(--font-mono);font-size:10.5px;color:var(--bone-faint);width:58px}
.map-legend-wrap{margin-top:14px}
.legend-toggle{background:none;border:1px solid var(--line);color:var(--bone-dim);border-radius:5px;padding:5px 12px;font-size:12px;font-family:var(--font-mono)}
.legend-toggle:hover{color:var(--bone);border-color:var(--bone-faint)}
.map-schematic-note{margin-top:14px;font-family:var(--font-mono);font-size:10.5px;letter-spacing:.03em;color:var(--bone-faint)}
.map-tooltip{position:absolute;pointer-events:none;background:rgba(13,14,11,.94);border:1px solid var(--line);color:var(--bone);font-family:var(--font-mono);font-size:11px;padding:5px 9px;border-radius:3px;z-index:6;white-space:nowrap}
.map-tour-caption{position:absolute;left:14px;bottom:44px;max-width:min(380px,calc(100% - 28px));background:rgba(19,20,15,.95);border:1px solid var(--line);border-left:3px solid var(--copper);border-radius:0 6px 6px 0;padding:14px 16px;z-index:7;animation:capIn .35s ease}
.map-tour-caption p{font-size:13px;color:var(--bone-dim);line-height:1.55;margin:6px 0 12px}
.tour-step-label{font-family:var(--font-mono);font-size:10px;color:var(--copper)}
.tour-controls{display:flex;gap:6px;flex-wrap:wrap}
.tour-controls .btn{padding:6px 12px;font-size:12px}
@keyframes capIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.map-scale{position:absolute;bottom:12px;right:14px;display:flex;align-items:center;gap:8px;font-family:var(--font-mono);font-size:10px;color:var(--bone-faint)}
.scale-bar-fill{height:4px;width:70px;border:1px solid var(--bone-faint);border-top:none;border-radius:0}
.loc-marker.active > circle:first-of-type{animation:selHalo 1.6s ease-out infinite}
@keyframes selHalo{0%{opacity:.35}100%{opacity:.12}}
@media(prefers-reduced-motion:reduce){.loc-marker.active > circle:first-of-type,.map-tour-caption{animation:none}}
.ml-swatch{display:inline-block;border-radius:50%;background:var(--copper);opacity:.7}
.ml-star{color:var(--amber)}
.ml-chip{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border:1px solid var(--line);border-radius:20px;background:var(--slate)}
.ml-chip i{width:9px;height:9px;border-radius:50%;display:inline-block}

/* ---------- learn / regions ---------- */
.article-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.article-card{border:1px solid var(--line);background:var(--slate);border-radius:6px;padding:20px;display:flex;flex-direction:column;gap:10px;min-height:150px}
.article-card h3{font-size:16px}
.article-card p{font-size:13px;color:var(--bone-dim);flex:1}
.article-cat{font-family:var(--font-mono);font-size:10px;color:var(--copper)}
.region-card{border:1px solid var(--line);background:var(--slate);border-radius:6px;padding:22px;margin-bottom:16px}
.region-card-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.region-card h3{font-size:19px}
.region-stats{display:flex;gap:18px;font-size:12px;color:var(--bone-faint);flex-wrap:wrap}
.region-stats b{color:var(--bone)}

/* ---------- geology timeline ---------- */
.timeline{border-left:2px solid var(--line);margin-left:8px;padding-left:26px;display:flex;flex-direction:column;gap:28px}
.tl-item{position:relative}
.tl-item::before{content:"";position:absolute;left:-32px;top:4px;width:9px;height:9px;border-radius:50%;background:var(--copper);border:2px solid var(--charcoal)}
.tl-item .era{font-family:var(--font-mono);font-size:11.5px;color:var(--copper);margin-bottom:4px}
.tl-item h4{font-size:16px;margin-bottom:6px}
.tl-item p{font-size:13.5px;color:var(--bone-dim);max-width:66ch;line-height:1.65}

/* ---------- charts / collection ---------- */
.chart-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}
@media(max-width:760px){.chart-grid{grid-template-columns:1fr}}
.chart-card{border:1px solid var(--line);background:var(--slate);border-radius:6px;padding:20px}
.chart-card h4{font-size:13.5px;color:var(--bone-dim);margin-bottom:14px;font-weight:500}
.chart-card canvas{max-height:230px}
.lab-toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.lab-shell{display:grid;grid-template-columns:1fr 320px;gap:0;border:1px solid var(--line);border-radius:8px;overflow:hidden}
@media(max-width:860px){.lab-shell{grid-template-columns:1fr}}
#lab-canvas-wrap{position:relative;background:radial-gradient(ellipse at 50% 30%,#1a1c17,var(--charcoal-2));min-height:460px}
#lab-canvas-host{width:100%;height:460px}
#lab-canvas-host canvas{width:100% !important;height:100% !important;cursor:grab}
#lab-hint{position:absolute;bottom:10px;left:14px;font-family:var(--font-mono);font-size:10.5px;color:var(--bone-faint)}
.lab-panel{background:var(--slate);border-left:1px solid var(--line);padding:20px;max-height:520px;overflow:auto}
@media(max-width:860px){.lab-panel{border-left:none;border-top:1px solid var(--line)}}
.chip.on{border-color:var(--malachite);color:var(--bone);background:rgba(87,161,127,.12)}
.spec-card{border:1px solid var(--line);background:var(--slate);border-radius:6px;padding:18px;display:flex;gap:16px}
.spec-icon{width:64px;height:64px;flex-shrink:0;border:1px solid var(--line);border-radius:6px;background:var(--charcoal-2);display:flex;align-items:center;justify-content:center;padding:10px}
.spec-id{font-family:var(--font-mono);font-size:10px;color:var(--bone-faint)}
.spec-card h4{font-size:15px;margin:2px 0 4px}
.spec-card p{font-size:12.5px;color:var(--bone-dim)}

/* ---------- footer ---------- */
footer{padding:44px 0 calc(44px + env(safe-area-inset-bottom,0px))}
.footer-grid{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;gap:32px}

.skel{background:linear-gradient(90deg,var(--slate) 25%,var(--slate-2) 37%,var(--slate) 63%);background-size:400% 100%;animation:sk 1.4s infinite;border-radius:4px}

:focus-visible{outline:2px solid var(--malachite);outline-offset:2px}
.back-link{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--bone-dim);margin-bottom:6px}
.back-link:hover{color:var(--bone)}
.two-col{display:grid;grid-template-columns:2fr 1fr;gap:40px}

.toc h5{font-family:var(--font-mono);font-size:10.5px;color:var(--bone-faint);margin-bottom:10px}
.toc a{display:block;padding:5px 0;color:var(--bone-dim)}
.toc a:hover{color:var(--bone)}

ералы вы ожидаете здесь найти? Отметьте все подходящие.","Olympiad training":"Олимпиадная подготовка","All topics":"Все темы","All levels":"Все уровни","Multiple choice":"Выбор ответа","Numeric answer":"Числовой ответ","not attempted":"не решалась","← Back to problem list":"← К списку задач","Show hint":"Показать подсказку","Check answer":"Проверить ответ","＋ Add specimen":"＋ Добавить образец","Import JSON":"Импорт JSON","Your shelf is empty":"Ваша полка пуста","Add your first specimen, or open any mineral page and press “＋ My collection”.":"Добавьте первый образец или откройте страницу любого минерала и нажмите «＋ В мою коллекцию».","Example records (not your specimens)":"Примеры записей (не ваши образцы)","These demonstration records only show the data layout: ID, mineral, locality, date and notes.":"Эти демонстрационные записи лишь показывают структуру данных: ID, минерал, локацию, дату и заметки.","NEW SPECIMEN":"НОВЫЙ ОБРАЗЕЦ","— not sure / other —":"— не уверен / другое —","Name or description":"Название или описание","useful if the mineral is unknown":"полезно, если минерал неизвестен","Locality in the Atlas":"Локация из Атласа","— not listed —":"— нет в списке —","Where exactly (free text)":"Где именно (свободный текст)","Date found / acquired":"Дата находки / приобретения","Identification status":"Статус определения","Confident identification":"Уверенное определение","Tentative identification":"Предварительное определение","Not yet identified":"Пока не определён","Identified by":"Кем определён","Field tests / Atlas Identify tool":"Полевые тесты / определитель Атласа","Laboratory analysis (XRD, microprobe…)":"Лабораторный анализ (РФА, микрозонд…)","Expert or museum":"Эксперт или музей","Seller's or collector's label":"Этикетка продавца или коллекционера","My own judgement":"Моё собственное суждение","Photo":"Фото","shrunk and kept in this browser":"уменьшается и хранится в этом браузере","Notes":"Заметки","Save specimen":"Сохранить образец","Cancel":"Отмена","Edit":"Править","🏷 Label":"🏷 Этикетка","Delete":"Удалить","Click again to delete":"Нажмите ещё раз, чтобы удалить","Unidentified specimen":"Неопознанный образец","Your personal specimen shelf. Add specimens with a photo, where you found them, and how sure you are about the identification. Everything is stored":"Ваша личная полка образцов. Добавляйте образцы с фото, местом находки и степенью уверенности в определении. Всё хранится","— export a backup now and then.":"— время от времени делайте резервную копию.","Print label":"Печать этикетки","← Back":"← Назад","Tip: choose “Save as PDF” in the print dialog to keep a copy.":"Совет: в окне печати выберите «Сохранить как PDF», чтобы оставить копию.","Hardness (Mohs)":"Твёрдость (по Моосу)","QR code unavailable offline — use the address below.":"QR-код недоступен без сети — используйте адрес ниже.","Educational reference. Identification from field properties is provisional.":"Справочный материал. Определение по полевым признакам предварительное.","Documented in":"Документировано в","Locality":"Локация","Date":"Дата","In simple words":"Простыми словами","Scientific":"Научно","Search terms…":"Поиск терминов…","@Search terms…":"Поиск терминов…","No matching term":"Подходящих терминов нет","Geology of Kyrgyzstan":"Геология Кыргызстана","Tectonic setting":"Тектоническая обстановка","Major geological units":"Основные геологические единицы","Mineralization and geology":"Оруденение и геология","Simplified timeline":"Упрощённая хронология","Back":"Назад","Previous":"Назад","Next":"Далее","Skip":"Пропустить","Explore the minerals, geology, and hidden geological diversity of Kyrgyzstan — a sourced, structured database of species, localities and the deposits that produced them.":"Изучайте минералы, геологию и скрытое геологическое разнообразие Кыргызстана — структурированную базу видов, локаций и месторождений с указанием источников.","Search, filter and sort every species in the atlas. Kyrgyz occurrences are shown only where a source has been documented — everything else is marked as a global reference entry pending verification.":"Ищите, фильтруйте и сортируйте все виды атласа. Находки в Кыргызстане показаны только там, где задокументирован источник; всё остальное помечено как справочная запись, ожидающая проверки.","A schematic geological visualization — real, sourced coordinates plotted against a stylized relief of the Tian Shan. Marker size reflects how many catalogued minerals are documented at a locality; color can be switched between mineral group, formation environment, or evidence strength. Where coordinates aren't publicly documented, that's stated rather than estimated.":"Схематическая геологическая визуализация — реальные координаты с источниками на стилизованном рельефе Тянь-Шаня. Размер маркера показывает, сколько минералов каталога документировано в локации; цвет можно переключать между группой минерала, средой образования и силой доказательств. Где координаты не опубликованы, это сказано прямо, а не оценено.","Kyrgyzstan is the Atlas's home ground. This overview widens the view to its neighbours and to Russia. Every point is a documented locality with sources and a list of minerals; a dashed ring marks positions that are only generalized or estimated. No national borders are drawn — the base map shows only coordinates, a graticule and a few schematic water bodies.":"Кыргызстан — родная территория Атласа. Этот обзор расширяет картину до соседних стран и России. Каждая точка — задокументированная локация с источниками и списком минералов; пунктирное кольцо отмечает положения, которые лишь обобщены или оценены. Государственные границы не нарисованы — на базовой карте только координаты, градусная сетка и несколько схематичных водоёмов.","An interactive model of each mineral's":"Интерактивная модель","crystal morphology":"морфологии кристаллов каждого минерала","— the external shape produced by its crystal system's symmetry. This is a teaching model, not a laboratory scan: only the species listed under \"Unit cell data\" below have sourced lattice parameters, and the atomic-structure viewer (§5–7 of the platform spec) is intentionally not built yet rather than filled with invented coordinates.":"— внешней формы, которую задаёт симметрия сингонии. Это учебная модель, а не лабораторный скан: опубликованные параметры решётки есть только у видов из раздела «Данные элементарной ячейки» ниже, а просмотр атомной структуры (§5–7 спецификации платформы) намеренно пока не создан, вместо того чтобы заполнять его выдуманными координатами.","Crystal structure vs. crystal habit:":"Кристаллическая структура и габитус:","the internal":"внутренняя","structure":"структура","habit":"габитус","is the fixed, repeating atomic lattice (unit cell) — it doesn't change. The external":"— это неизменная повторяющаяся атомная решётка (элементарная ячейка). Внешний","is the shape a specimen happens to grow into, which depends on growth conditions and can vary even within one species. This lab visualizes habit (and, where sourced, unit-cell proportions); it is not a substitute for X-ray diffraction data.":"— это форма, в которую вырастает образец; она зависит от условий роста и может различаться даже внутри одного вида. Эта лаборатория показывает габитус (и, где есть источники, пропорции элементарной ячейки); она не заменяет данные рентгеновской дифракции.","Choose two to four species to line up their properties side by side. Differences are highlighted, without ranking one mineral as scientifically \"better\" than another.":"Выберите от двух до четырёх видов, чтобы сравнить их свойства рядом. Различия подсвечены, при этом ни один минерал не объявляется научно «лучше» другого.","Click any element to see which catalogued minerals contain it. Elements represented in the database are highlighted; the small number in the corner counts matching minerals.":"Нажмите на любой элемент, чтобы увидеть, какие минералы каталога его содержат. Элементы, представленные в базе, выделены; маленькое число в углу — количество подходящих минералов.","Administrative regions with a short geological overview and any sourced mineral occurrences currently catalogued. Kyrgyzstan comes first; its Central Asian neighbours and Russia follow.":"Административные регионы с краткой геологической справкой и всеми внесёнными находками минералов с источниками. Первым идёт Кыргызстан; затем — его центральноазиатские соседи и Россия.","A small field-laboratory training environment built entirely from this Atlas's own sourced data. Difficulty labels are learning levels, not claims of scientific authority — and every identification exercise carries the same caveat a real field geologist would give.":"Небольшая полевая учебная лаборатория, построенная целиком на собственных данных Атласа с источниками. Уровни сложности — это учебные уровни, а не претензия на научный авторитет; в каждом упражнении по определению есть та же оговорка, что сделал бы настоящий полевой геолог.","A small, hand-written problem bank across mineralogy, chemistry, crystallography and geology. Progress is tracked only in this browser (via local storage) — there is no account system, global ranking, or leaderboard.":"Небольшой написанный вручную банк задач по минералогии, химии, кристаллографии и геологии. Прогресс хранится только в этом браузере (в локальном хранилище) — аккаунтов, мирового рейтинга и таблицы лидеров нет.","Short, accurate primers on mineralogy fundamentals, mineral groups, and the geological processes behind the deposits in this atlas.":"Короткие точные введения в основы минералогии, группы минералов и геологические процессы, стоящие за месторождениями этого атласа.","An accessible overview of the tectonic setting that produced the deposits catalogued in this atlas.":"Доступный обзор тектонической обстановки, создавшей месторождения, описанные в этом атласе.","The host rocks catalogued minerals are found in — each is a generalized, standard rock classification, cross-linked to every mineral documented within it.":"Породы, в которых встречаются минералы каталога — каждая является обобщённой стандартной классификацией, связанной со всеми документированными в ней минералами.","Every source cited anywhere in the Atlas, collected in one place. Each entry links back to the localities that cite it — this list is generated directly from the database, not maintained separately.":"Все источники, процитированные в Атласе, собранные в одном месте. Каждая запись ведёт к локациям, которые на неё ссылаются; список строится прямо из базы данных, а не ведётся отдельно.","General mineralogical properties (hardness, density, crystal system, etc.) reflect standard, widely published mineralogical reference data rather than a single citable source, and are not listed individually here — only Kyrgyzstan-specific occurrence sources are.":"Общие минералогические свойства (твёрдость, плотность, сингония и т. д.) отражают стандартные, широко опубликованные справочные данные, а не один цитируемый источник, и здесь по отдельности не перечислены — только источники по конкретным находкам.","Not a live AI model — published Atlas pages can't call one. This is a transparent, rule-based search over the Atlas's own structured data: it only answers from what's actually catalogued here, and says so plainly when it can't.":"Это не живая модель ИИ: опубликованные страницы Атласа не могут её вызывать. Это прозрачный поиск по правилам в собственных структурированных данных Атласа: он отвечает только тем, что здесь действительно каталогизировано, и прямо говорит, когда не может ответить.","One place to find photographs of every mineral in the Atlas. Photos aren't hosted here — each button opens a ready-made search in a new tab. Minerals with documented Kyrgyz occurrences also get a ★ shortcut for specimens from Kyrgyzstan.":"Одно место, где можно найти фотографии любого минерала Атласа. Фото здесь не хранятся — каждая кнопка открывает готовый поиск в новой вкладке. У минералов с документированными находками есть также кнопка для образцов из соответствующей страны (★ — Кыргызстан).","Educational identification exercise. Field observations alone cannot replace laboratory analysis, and a mineral that isn't catalogued here can never appear in the results.":"Учебное упражнение по определению. Полевые наблюдения не заменяют лабораторный анализ, а минерал, которого нет в каталоге, не может появиться в результатах.","rub the specimen on an unglazed white ceramic tile and look at the powder, not the surface. Minerals harder than the tile (about 6.5) leave no streak.":"потрите образец о неглазурованную белую керамическую плитку и смотрите на порошок, а не на поверхность. Минералы твёрже плитки (около 6,5) черты не оставляют.","try a fingernail (≈2.5), a copper coin (≈3.5), a steel knife (≈5.5) and glass (≈5.5). The harder object scratches the softer one. Use a fresh surface and an inconspicuous spot.":"попробуйте ноготь (≈2,5), медную монету (≈3,5), стальной нож (≈5,5) и стекло (≈5,5). Более твёрдый предмет царапает более мягкий. Берите свежую поверхность и неприметное место.","turn the specimen in the light; cleavage shows as flat, flashing surfaces at fixed angles, unlike an irregular break.":"поворачивайте образец на свету; спайность видна как плоские блестящие поверхности под постоянными углами, в отличие от неровного излома.","hold it next to a quartz pebble of similar size — is it noticeably heavier?":"подержите рядом с кварцевой галькой похожего размера — заметно ли тяжелее?","carbonates fizz in dilute hydrochloric acid. Only try this with eye protection, ventilation and adult supervision; skip it if unsure. Never taste or sniff minerals, and wash your hands afterwards.":"карбонаты вскипают в разбавленной соляной кислоте. Пробуйте только в защитных очках, при вентиляции и под присмотром взрослого; если сомневаетесь — пропустите. Никогда не пробуйте минералы на вкус и запах и мойте руки после работы.","Streak:":"Черта:","Hardness:":"Твёрдость:","Luste const ARTICLES = [
 {id:"what-is-a-mineral",cat:"Fundamentals",title:"What is a mineral?",
  body:"A mineral is a naturally occurring, inorganic solid with a definite chemical composition (or a composition that varies within defined limits) and an ordered, repeating internal atomic structure. That ordered structure is what separates minerals from amorphous natural solids like volcanic glass — and the requirement of a definite composition is what separates a mineral species from a rock, which is an aggregate of one or more minerals (and sometimes mineraloids or organic matter). Roughly 5,800 mineral species are currently approved by the International Mineralogical Association, a number that grows most years as new species are described from rigorous structural and chemical analysis — as happened at Tyuya-Muyun with tyuyamunite and turanite."},
 {id:"how-crystals-form",cat:"Fundamentals",title:"How crystals form",
  body:"Crystals grow when atoms or ions arrange themselves into a repeating, ordered lattice as a substance moves from a disordered state (a melt, a solution, or a vapor) toward chemical equilibrium. Growth proceeds face by face as new material attaches preferentially at the fastest-growing crystal faces, while the slower-growing faces come to dominate the crystal's outward form. The rate of cooling or evaporation, the availability of open space, and the presence of impurities all influence whether a crystal grows large and well-formed (euhedral) or is stunted and intergrown with its neighbors (anhedral) — which is why hydrothermal vein cavities, like those at Tyuya-Muyun and Khaidarkan, often produce the best-formed specimens: they give crystals open space and time to grow."},

 {id:"identification",cat:"Fundamentals",title:"Mineral identification basics",
  body:"Field identification typically works through a short sequence of tests, roughly in order of ease: color (least reliable, since impurities can shift it dramatically), streak (the color of a mineral's powder, obtained by scratching it on an unglazed porcelain plate — far more diagnostic than surface color), luster (how light reflects off a fresh surface — metallic, vitreous, adamantine, pearly, silky, resinous, dull), hardness (via scratch comparison), cleavage and fracture (how the mineral breaks), density (how heavy it feels for its size), and crystal habit. No single test is usually conclusive alone; mineralogists combine several. This site avoids describing any chemical reagent tests beyond the standard, low-risk dilute-acid carbonate test that any trained geologist uses safely in the field."},

REGIONS.forEach(r=>{ r.localities = LOCALITIES.filter(l=>l.regionId===r.id); });

function elementCount(sym){return MINERALS.filter(m=>m.elements.includes(sym)).length;}

/* ---- verification status: 4-state model (replaces the old boolean) ----
   verified      = occurrence backed by a cited, checkable source
   approximate   = occurrence documented, but a specific property (usually
                   a physical constant for a very rare species) is loosely
                   constrained in the literature reviewed
   under_review  = reserved for future curator workflow (§38)
   unverified    = no Kyrgyzstan-specific source found; global reference only */
const APPROXIMATE_PROPERTY_IDS = ["khaidarkanite","wakabayashilite","turanite","thorite","bastnasite","eudialyte"];
const VERIFICATION_META = {
  verified:     {label:"Verified in Kyrgyzstan", short:"✓ verified", icon:"✓", cls:"badge-verified"},
  approximate:  {label:"Documented, some data approximate", short:"≈ approximate", icon:"≈", cls:"badge-approx"},
  under_review: {label:"Under review", short:"⋯ under review", icon:"⋯", cls:"badge-review"},
  unverified:   {label:"Not yet verified in Kyrgyzstan", short:"⚠ not yet verified", icon:"⚠", cls:"badge-unverified"}
};

/* ---- Occurrence junction table: generated from Locality↔Mineral links,
   not hand-duplicated, so Locality and Mineral records stay the single
   source of truth. Each occurrence carries its own source list and
   verification status — this is the relational core the rest of the
   platform (map, mineral pages, data export) reads from. ---- */
const OCCURRENCES = [];
LOCALITIES.forEach(l=>{
  l.mineralIds.forEach(mid=>{
    const m = MINERALS_BY_ID[mid];
    if(!m) return;
    const approx = APPROXIMATE_PROPERTY_IDS.includes(mid);
    OCCURRENCES.push({
      id:`${l.id}__${mid}`, mineralId:mid, localityId:l.id, regionId:l.regionId, countryId:l.countryId,
      sources:l.sources, status: approx ? "approximate" : "verified",
      notes: approx ? "Occurrence documented; some physical constants or the exact species attribution are loosely constrained in the literature reviewed." : ""
    });
  });
});
/* Per-mineral documentation is now computed from the occurrences, per country.
   verifiedKG / verificationStatus keep their original meaning (documented in
   Kyrgyzstan); countryIds lists every country where the Atlas documents the species. */
MINERALS.forEach(m=>{
  const occ = OCCURRENCES.filter(o=>o.mineralId===m.id);
  m.localityIds = occ.map(o=>o.localityId);
  m.countryIds = [...new Set(occ.map(o=>o.countryId))];
  const kgOcc = occ.filter(o=>o.countryId==="kg");
  m.verifiedKG = kgOcc.length>0;
  m.verificationStatus = kgOcc.length ? (kgOcc.every(o=>o.status==="approximate") ? "approximate" : "verified") : "unverified";
});
if(MINERALS_BY_ID.pyrophyllite && !MINERALS_BY_ID.pyrophyllite.typeLocality) MINERALS_BY_ID.pyrophyllite.typeLocality = "Berezovskoye deposit (Urals, Russia)";
function countryNameOf(l){ return (COUNTRIES_BY_ID[l.countryId]||{}).name || ""; }
function ruName(s){ try{ return I18N_RU.exact[s] || ""; }catch(e){ return ""; } }

   Generalized rock-type entity, cross-linked from minerals via HOST_ROCKS
   below. These are standard, well-established rock classifications —

/* ===================== Formation pathway engine =====================
   Rather than hand-authoring a formation-stage breakdown for every mineral
   (which would mean re-describing the same textbook process 46 times, or
   risking drift from the real per-mineral formation text above), the
   pathway TYPE is inferred from keywords already present in each mineral's
   own reviewed `formation` text, and mapped to a generic, scientifically
   standard stage sequence for that process. The mineral's own specific
   formation paragraph is always shown alongside — the generic stages
   explain the general process; the paragraph gives the sourced specifics. */

  ],
  hydrothermal:[
    {name:"Fluid Source", desc:"Hot, chemically reactive water — heated by nearby magma, deep circulation, or metamorphic devolatilization — leaches elements from surrounding rock.", temp:"Typically 50–400 °C depending on the system.", chem:"Metals and other elements dissolve into the fluid as ions or complexes."},
    {name:"Fluid Transport", desc:"The mineral-laden fluid migrates along faults, fractures and permeable rock, often over considerable distances.", temp:"Gradual cooling as the fluid moves away from its heat source.", chem:"Fluid chemistry evolves through reaction with wall rock along the flow path."},
    {name:"Chemical Trigger", desc:"Cooling, boiling, dilution by mixing with another fluid, or reaction with new host rock pushes the fluid past saturation.", temp:"A drop in temperature or pressure is the most common trigger.", chem:"Solubility falls below the concentration carried in solution."},
    {name:"Nucleation & Growth", desc:"Once supersaturated, the mineral nucleates on available surfaces and grows into open space such as veins and vugs.", temp:"Growth rate depends on how far the fluid was pushed past saturation.", chem:"Ions attach preferentially at the fastest-growing crystal faces."},
    {name:"Vein / Deposit", desc:"Repeated pulses of fluid flow build up a mineralized vein or replacement zone — the deposit ultimately exposed and studied today.", temp:"—", chem:"—"}
  ],
  metamorphic:[
    {name:"Parent Rock", desc:"An existing rock is subjected to heat and/or pressure without melting, usually during regional mountain-building or contact with an intrusion.", temp:"Typically 150–700 °C, variable pressure.", chem:"Original minerals become chemically unstable under the new conditions."},
    {name:"Recrystallization", desc:"Atoms migrate short distances through the still-solid rock, breaking old mineral bonds and forming new, more stable minerals.", temp:"Sustained elevated temperature and/or pressure over geological time.", chem:"New mineral assemblages reflect the rock's bulk chemistry at the new conditions."},
    {name:"Mineral Growth", desc:"The mineral grows as a new, stable phase, often aligned with the dominant stress direction — producing the layered look of many metamorphic rocks.", temp:"Growth continues as long as conditions remain favorable.", chem:"Elements redistribute between coexisting mineral phases (paragenesis)."},
    {name:"Metamorphic Rock", desc:"The rock reaches a new equilibrium mineral assemblage, now classified as a metamorphic rock bearing this mineral.", temp:"Preserved until later uplift and erosion expose it at the surface.", chem:"The mineral becomes a useful indicator of the metamorphic grade reached."}

  "sedimentary-evaporite":[

  ],
  "weathering-secondary":[
    {name:"Primary Mineral", desc:"A pre-existing primary mineral (often a sulfide) sits within reach of the water table.", temp:"Surface to shallow subsurface temperature.", chem:"The primary mineral is chemically unstable in an oxidizing, water-rich environment."},
    {name:"Oxidation", desc:"Oxygen-rich groundwater percolating down from the surface reacts with the primary mineral, breaking it down.", temp:"Ambient surface/near-surface temperature.", chem:"Elements are released and oxidized, often changing their solubility dramatically."},
    {name:"Transport in Solution", desc:"Freed elements are carried short distances in solution, sometimes reacting with different rock along the way.", temp:"—", chem:"Local pH and available anions determine which secondary mineral can form."},

  ],
  "karst-secondary":[
    {name:"Cave System Develops", desc:"Groundwater slowly dissolves a limestone or marble host rock, opening cavities and fractures over a long period.", temp:"Ambient shallow-crustal temperature.", chem:"Carbonate rock is dissolved by mildly acidic groundwater."},
